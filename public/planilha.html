<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.json">
<title>Meu Bolso — Planilha</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --ink:#16261F;
  --ink-soft:#3C4B43;
  --paper:#FAF7F0;
  --paper-dim:#F0ECE1;
  --card:#FFFFFF;
  --accent:#E8622C;
  --accent-dark:#C64F1E;
  --line:#E4DFD1;
  --fixo:#2F6FED;
  --superfluo:#E8922C;
  --diaadia:#D9B62C;
  --imprevisto:#D64545;
  --entrada:#2F9E68;
  --erro:#D64545;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html{ touch-action:manipulation; }
html, body{ height:100%; }
body{
  background:#FFFFFF;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:var(--ink);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom);
  padding-top:env(safe-area-inset-top);
}
.topbar{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:14px 20px 10px;
  max-width:460px; margin:0 auto; width:100%;
  flex-shrink:0;
}
.topbar h1{ font-family:'Sora', sans-serif; font-weight:800; font-size:16px; flex:1; text-align:center; }
.nav-btn{
  width:38px; height:38px; border-radius:11px; background:var(--card);
  border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--ink-soft); flex-shrink:0; transition:transform .1s;
}
.nav-btn:active{ transform:scale(0.9); background:var(--paper-dim); }
.wrap{
  max-width:460px; margin:0 auto; width:100%;
  padding:6px 20px 20px; display:flex; flex-direction:column; gap:12px;
  flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain;
}

.saldo-card{
  border:1.5px solid var(--ink); border-radius:16px; padding:16px; text-align:center;
}
.saldo-card .label{ font-size:11.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.saldo-card .valor{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:32px; margin-top:4px; }
.saldo-card .valor.negativo{ color:var(--erro); }
.saldo-card .valor.positivo{ color:var(--entrada); }

.tabs{
  display:flex; gap:6px; background:var(--paper-dim); padding:4px; border-radius:12px; border:1.5px solid var(--ink);
}
.tabs button{
  flex:1; padding:9px; border-radius:9px; border:none; font-family:'Sora', sans-serif; font-weight:700; font-size:12px;
  background:transparent; color:var(--ink-soft);
}
.tabs button.active{ background:var(--ink); color:#fff; }

.aba{ display:none; flex-direction:column; gap:12px; }
.aba.visivel{ display:flex; }

.totais-row{ display:flex; gap:6px; flex-wrap:wrap; }
.totais-row .chip{
  flex:1; min-width:70px; border:1.5px solid var(--ink); border-radius:11px; padding:8px 6px; text-align:center;
}
.totais-row .chip.ativo{ background:var(--ink); }
.totais-row .chip.ativo .nome{ color:#fff; }
.totais-row .chip.ativo .val{ color:#fff; }
.totais-row .chip .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
.totais-row .chip .nome{ font-size:10px; font-weight:700; color:var(--ink-soft); }
.totais-row .chip .val{ font-family:'JetBrains Mono', monospace; font-size:12.5px; font-weight:700; margin-top:2px; }

.lista{ display:flex; flex-direction:column; gap:8px; }
.item-wrap{ display:flex; flex-direction:column; }
.item{
  display:flex; align-items:center; gap:10px; border:1.5px solid var(--ink); border-radius:13px; padding:11px 13px;
  cursor:pointer;
}
.item .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.item .info{ flex:1; min-width:0; }
.item .desc{ font-family:'Sora', sans-serif; font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .obs{ font-size:11px; color:var(--ink-soft); margin-top:1px; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .data{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
.item .valor{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:14px; flex-shrink:0; }
.item .valor.entrada{ color:var(--entrada); }
.item .valor.saida{ color:var(--ink); }

.acoes-lanc{ display:none; gap:8px; padding:8px 4px 0; }
.acoes-lanc.visivel{ display:flex; }
.acoes-lanc button{
  flex:1; padding:9px; border-radius:9px; border:1.5px solid var(--ink); font-family:'Sora', sans-serif; font-weight:700; font-size:11.5px; background:var(--card); color:var(--ink-soft);
}
.acoes-lanc button.excluir{ color:var(--erro); }

.editar-lanc{ display:none; flex-direction:column; gap:8px; padding:10px 4px 4px; border-top:1.5px dashed var(--line); margin-top:8px; }
.editar-lanc.visivel{ display:flex; }
.editar-lanc input, .editar-lanc select{
  border:1.5px solid var(--ink); border-radius:10px; padding:9px 11px; font-size:13px; font-family:'Sora', sans-serif; background:var(--card); color:var(--ink);
}
.editar-lanc .salvar-edicao{
  background:var(--ink); color:#fff; border:none; padding:10px; border-radius:10px; font-family:'Sora', sans-serif; font-weight:700; font-size:12.5px;
}

.item.fantasma{ border-style:dashed; }
.item.fantasma .valor.fantasma-valor{ color:var(--ink-soft); font-weight:600; }
.badge-fantasma{ font-size:9px; font-weight:700; color:var(--ink-soft); background:var(--paper-dim); padding:2px 6px; border-radius:100px; margin-left:4px; white-space:nowrap; }
.item.fantasma.vencida{ background:#FBEAEA; border-color:var(--imprevisto); }
.item.fantasma.hoje-receber{ background:#E6F5EB; border-color:var(--entrada); }
.item.fantasma.proxima-pagar{ background:#FCEEDD; border-color:var(--superfluo); }
.item.fantasma.proxima-receber{ background:#E6F5EB; border-color:var(--entrada); }

.vazio{ text-align:center; color:var(--ink-soft); font-size:12.5px; padding:20px 10px; }

.total-filtro{
  margin-top:4px; text-align:center; padding:12px; border-radius:100px;
  border:1.5px solid var(--ink); color:#fff;
  font-family:'Sora', sans-serif; font-weight:800; font-size:13.5px;
}
.total-filtro span{ font-family:'JetBrains Mono', monospace; font-weight:700; }

.busca-lanc{
  width:100%; border:1.5px solid var(--ink); border-radius:11px; padding:10px 12px; font-size:13px;
  font-family:'Sora', sans-serif; color:var(--ink); background:var(--card);
}

.btn-novo{
  border:1.5px solid var(--ink); border-radius:13px; padding:11px; text-align:center;
  font-family:'Sora', sans-serif; font-weight:700; font-size:13px; background:var(--card);
}

.form-pendencia{ display:none; flex-direction:column; gap:8px; border:1.5px solid var(--ink); border-radius:14px; padding:14px; }
.form-pendencia.visivel{ display:flex; }
.form-pendencia input, .form-pendencia select{
  border:1.5px solid var(--ink); border-radius:11px; padding:10px 12px; font-size:13.5px; font-family:'Sora', sans-serif; color:var(--ink); background:var(--card);
}
.form-pendencia .toggle-tipo{ display:flex; gap:6px; }
.form-pendencia .toggle-tipo button{
  flex:1; padding:9px; border-radius:9px; border:1.5px solid var(--ink); font-family:'Sora', sans-serif; font-weight:700; font-size:12px; background:var(--card); color:var(--ink-soft);
}
.form-pendencia .toggle-tipo button.active.pagar{ background:var(--imprevisto); color:#fff; }
.form-pendencia .toggle-tipo button.active.receber{ background:var(--entrada); color:#fff; }
.btn-recorrente{
  border:1.5px solid var(--ink); border-radius:11px; padding:10px; text-align:center; background:var(--card);
  font-family:'Sora', sans-serif; font-weight:700; font-size:12.5px; color:var(--ink-soft);
}
.btn-recorrente.ativo{ background:var(--accent); border-color:var(--accent); color:#fff; }
.form-pendencia .btn-salvar{
  background:var(--ink); color:#fff; padding:11px; border-radius:11px; text-align:center; font-family:'Sora', sans-serif; font-weight:700; font-size:13px; border:none;
}

.secao-titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }

.colunas{ display:flex; gap:8px; align-items:flex-start; }
.coluna{ flex:1; min-width:0; display:flex; flex-direction:column; }

.pendencia-card{ border:1.5px solid var(--ink); border-radius:13px; padding:10px 11px; display:flex; flex-direction:column; gap:7px; }
.pendencia-card .linha-topo{ display:flex; flex-direction:column; gap:1px; }
.pendencia-card .nome{ font-family:'Sora', sans-serif; font-weight:700; font-size:12.5px; }
.pendencia-card .data{ font-size:10px; color:var(--ink-soft); }
.pendencia-card .valor{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12px; }
.pendencia-card .acoes{ display:flex; flex-direction:column; gap:6px; }
.pendencia-card .acoes button{
  padding:8px; border-radius:9px; border:1.5px solid var(--ink); font-family:'Sora', sans-serif; font-weight:700; font-size:11.5px; background:var(--card);
}
.pendencia-card .acoes .resolver{ background:var(--ink); color:#fff; }
.pendencia-card .acoes .excluir{ color:var(--erro); }
.pendencia-card .badge-estado{ font-weight:800; font-size:9.5px; letter-spacing:.04em; }

.pendencia-card.vencida{ background:var(--imprevisto); border-color:var(--imprevisto); }
.pendencia-card.vencida .nome, .pendencia-card.vencida .data, .pendencia-card.vencida .valor, .pendencia-card.vencida .badge-estado{ color:#fff; }
.pendencia-card.vencida .acoes .resolver{ background:#fff; color:var(--imprevisto); border-color:#fff; }
.pendencia-card.vencida .acoes .excluir{ background:transparent; color:#fff; border-color:#fff; }

.pendencia-card.hoje-receber{ background:var(--entrada); border-color:var(--entrada); }
.pendencia-card.hoje-receber .nome, .pendencia-card.hoje-receber .data, .pendencia-card.hoje-receber .valor, .pendencia-card.hoje-receber .badge-estado{ color:#fff; }
.pendencia-card.hoje-receber .acoes .resolver{ background:#fff; color:var(--entrada); border-color:#fff; }
.pendencia-card.hoje-receber .acoes .excluir{ background:transparent; color:#fff; border-color:#fff; }

.pendencia-card.proxima-pagar{ background:#FCEEDD; border-color:var(--superfluo); }
.pendencia-card.proxima-receber{ background:#E6F5EB; border-color:var(--entrada); }

.resolver-form{ display:none; flex-direction:column; gap:7px; border-top:1.5px dashed var(--line); padding-top:9px; }
.resolver-form.visivel{ display:flex; }
.resolver-form input, .resolver-form select{
  border:1.5px solid var(--ink); border-radius:10px; padding:9px 11px; font-size:13px; font-family:'Sora', sans-serif; background:var(--card); color:var(--ink);
}
.resolver-form .pay-row{ display:flex; gap:6px; }
.resolver-form .pay-row div{
  flex:1; text-align:center; padding:8px 2px; border-radius:9px; border:1.5px solid var(--ink); font-size:11px; font-weight:700; background:var(--card); color:var(--ink-soft);
}
.resolver-form .pay-row div.active{ background:var(--ink); color:#fff; }
.resolver-form .confirmar{ background:var(--entrada); color:#fff; padding:9px; border-radius:10px; border:none; font-weight:700; font-size:12.5px; }

.erro-msg{
  background:#FBEAEA; color:var(--erro); font-size:12.5px; font-weight:600;
  padding:10px 14px; border-radius:10px; display:none;
}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:100px;
  font-family:'Sora', sans-serif; font-size:13px; font-weight:600; display:none; white-space:nowrap; z-index:10;
}

.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(22,38,31,.55);
  align-items:center; justify-content:center; z-index:50; padding:24px;
}
.modal-overlay.visivel{ display:flex; }
.modal-card{
  background:var(--card); border:1.5px solid var(--ink); border-radius:18px; padding:22px 20px;
  max-width:340px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.modal-titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:15.5px; margin-bottom:8px; }
.modal-mensagem{ font-size:13px; line-height:1.5; color:var(--ink-soft); margin-bottom:18px; }
.modal-botoes{ display:flex; gap:8px; }
.modal-botoes button{
  flex:1; padding:11px; border-radius:11px; font-family:'Sora', sans-serif; font-weight:700; font-size:13px; border:1.5px solid var(--ink);
}
.modal-cancelar{ background:var(--card); color:var(--ink-soft); }
.modal-confirmar{ background:var(--imprevisto); color:#fff; border-color:var(--imprevisto); }
</style>
</head>
<body>

<div class="topbar">
  <div class="nav-btn" onclick="window.location.href='/home.html'">←</div>
  <h1>Planilha</h1>
  <div class="nav-btn" onclick="window.location.href='/analise.html'">📊</div>
  <div class="nav-btn" onclick="window.location.href='/relatorio.html'">🧾</div>
  <div class="nav-btn" onclick="window.location.href='/configuracoes.html'">⚙️</div>
  <div class="nav-btn" id="btnAtualizar" onclick="location.reload()">🔄</div>
</div>

<div class="wrap">

  <div class="saldo-card">
    <div class="label">Saldo do mês</div>
    <div class="valor" id="saldoValor">R$ 0,00</div>
  </div>

  <div class="tabs">
    <button class="active" id="tabLancamentos" onclick="mostrarAba('lancamentos')">Lançamentos</button>
    <button id="tabPendencias" onclick="mostrarAba('pendencias')">A Pagar &amp; Receber</button>
  </div>

  <div class="erro-msg" id="erroMsg"></div>

  <div class="aba visivel" id="abaLancamentos">
    <div class="totais-row">
      <div class="chip" id="chipEntrada" onclick="filtrarPorCategoria('entrada')"><div><span class="dot" style="background:var(--entrada)"></span><span class="nome">Entrada</span></div><div class="val" id="totalEntrada">R$0,00</div></div>
      <div class="chip" id="chipFixo" onclick="filtrarPorCategoria('fixo')"><div><span class="dot" style="background:var(--fixo)"></span><span class="nome">Fixo</span></div><div class="val" id="totalFixo">R$0,00</div></div>
      <div class="chip" id="chipSuperfluo" onclick="filtrarPorCategoria('superfluo')"><div><span class="dot" style="background:var(--superfluo)"></span><span class="nome">Supérfluo</span></div><div class="val" id="totalSuperfluo">R$0,00</div></div>
      <div class="chip" id="chipDiaadia" onclick="filtrarPorCategoria('diaadia')"><div><span class="dot" style="background:var(--diaadia)"></span><span class="nome">Dia a dia</span></div><div class="val" id="totalDiaadia">R$0,00</div></div>
      <div class="chip" id="chipImprevisto" onclick="filtrarPorCategoria('imprevisto')"><div><span class="dot" style="background:var(--imprevisto)"></span><span class="nome">Imprevisto</span></div><div class="val" id="totalImprevisto">R$0,00</div></div>
    </div>

    <div class="secao-titulo" id="tituloListaLanc" style="margin-bottom:-2px;">Todos os lançamentos</div>
    <input type="text" class="busca-lanc" id="buscaLancamentos" placeholder="Buscar por nome (ex: hambúrguer)..." oninput="buscarComAtrasoLancamentos()">
    <div class="lista" id="listaLancamentos"></div>
  </div>

  <div class="aba" id="abaPendencias">
    <div class="btn-novo" id="btnNovaPendencia" onclick="alternarFormPendencia()">+ Nova pendência</div>

    <div class="form-pendencia" id="formPendencia">
      <div class="toggle-tipo">
        <button type="button" class="active pagar" id="btnTipoPagar" onclick="setTipoPendencia('pagar')">A Pagar</button>
        <button type="button" id="btnTipoReceber" class="receber" onclick="setTipoPendencia('receber')">A Receber</button>
      </div>
      <input type="text" id="pendNome" placeholder="Nome (ex: Conta de luz)">
      <input type="date" id="pendData">
      <input type="text" id="pendValor" placeholder="Valor (opcional)" inputmode="decimal">
      <button type="button" class="btn-recorrente" id="btnRecorrente" onclick="alternarRecorrente()">🔁 Repetir todo mês</button>
      <button class="btn-salvar" onclick="salvarPendencia()">Salvar</button>
    </div>

    <div class="colunas">
      <div class="coluna">
        <div class="secao-titulo" style="margin-bottom:8px; color:var(--imprevisto);">A Pagar</div>
        <div class="lista" id="listaPagar"></div>
      </div>

      <div class="coluna">
        <div class="secao-titulo" style="margin-bottom:8px; color:var(--entrada);">A Receber</div>
        <div class="lista" id="listaReceber"></div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-titulo" id="modalTitulo"></div>
    <div class="modal-mensagem" id="modalMensagem"></div>
    <div class="modal-botoes">
      <button class="modal-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="modal-confirmar" id="modalBtnConfirmar">Confirmar</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('meubolso_token');

if (!token) {
  window.location.href = '/index.html';
}

let tipoPendenciaAtual = 'pagar';
let recorrenteAtivo = false;
let lancamentosCache = [];
let pendenciasCache = [];
let filtroAtivo = null;
let buscaTexto = '';
let buscaTimerLanc = null;

function buscarComAtrasoLancamentos() {
  clearTimeout(buscaTimerLanc);
  buscaTimerLanc = setTimeout(() => {
    buscaTexto = document.getElementById('buscaLancamentos').value.trim();
    renderizarLancamentos();
  }, 300);
}

function normalizarBusca(texto) {
  return String(texto).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function alternarRecorrente() {
  recorrenteAtivo = !recorrenteAtivo;
  document.getElementById('btnRecorrente').classList.toggle('ativo', recorrenteAtivo);
}

const NOMES_FILTRO = { entrada: 'Entradas', fixo: 'Gastos Fixos', superfluo: 'Gastos Supérfluos', diaadia: 'Gastos do Dia a dia', imprevisto: 'Imprevistos' };
const CHIPS_ID = { entrada: 'chipEntrada', fixo: 'chipFixo', superfluo: 'chipSuperfluo', diaadia: 'chipDiaadia', imprevisto: 'chipImprevisto' };

function filtrarPorCategoria(categoria) {
  filtroAtivo = filtroAtivo === categoria ? null : categoria;
  Object.values(CHIPS_ID).forEach(id => document.getElementById(id).classList.remove('ativo'));
  if (filtroAtivo) {
    document.getElementById(CHIPS_ID[filtroAtivo]).classList.add('ativo');
  }
  renderizarLancamentos();
}

function formatarMoeda(valor) {
  const n = Number(valor || 0);
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function paraNumero(str) {
  if (str === undefined || str === null || str === '') return NaN;
  let s = String(str).trim();
  if (s.includes(',')) {
    s = s.replace(/\./g, '').replace(',', '.');
  }
  return Number(s);
}

// Constrói a data usando os componentes ano/mes/dia direto, sem passar por
// UTC/fuso horário — evita o "dia errado" que acontece com new Date(isoString)
// quando o dispositivo está no fuso do Brasil (UTC-3).
function paraDataLocal(dataStr) {
  const soData = String(dataStr).slice(0, 10);
  const [ano, mes, dia] = soData.split('-').map(Number);
  return new Date(ano, mes - 1, dia);
}

function formatarDataVencimento(dataStr) {
  return paraDataLocal(dataStr).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}

function hojeISOLocal() {
  const d = new Date();
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

function formatarData(dataStr) {
  const d = new Date(dataStr);
  const dataFmt = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const horaFmt = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return `${dataFmt} · ${horaFmt}`;
}

let acaoConfirmada = null;

function abrirModal(titulo, mensagem, textoBotao, corBotao, callback) {
  document.getElementById('modalTitulo').textContent = titulo;
  document.getElementById('modalMensagem').textContent = mensagem;
  const btn = document.getElementById('modalBtnConfirmar');
  btn.textContent = textoBotao;
  btn.style.background = corBotao;
  btn.style.borderColor = corBotao;
  acaoConfirmada = callback;
  document.getElementById('modalOverlay').classList.add('visivel');
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('visivel');
  acaoConfirmada = null;
}

document.getElementById('modalBtnConfirmar').addEventListener('click', () => {
  const acao = acaoConfirmada;
  fecharModal();

});

function mostrarErro(msg) {

function mostrarToast(msg) {

  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2200);
}

function mostrarAba(nome) {

  document.getElementById('abaPendencias').classList.toggle('visivel', nome === 'pendencias');
  document.getElementById('tabLancamentos').classList.toggle('active', nome === 'lancamentos');
  document.getElementById('tabPendencias').classList.toggle('active', nome === 'pendencias');
}

function alternarFormPendencia() {

  form.classList.toggle('visivel');
  if (form.classList.contains('visivel')) {
    document.getElementById('pendData').value = hojeISOLocal();

}

function setTipoPendencia(tipo) {

  document.getElementById('btnTipoPagar').classList.toggle('active', tipo === 'pagar');
  document.getElementById('btnTipoReceber').classList.toggle('active', tipo === 'receber');
}

async function carregarTudo() {
  await Promise.all([carregarLancamentos(), carregarPendencias()]);
}

async function carregarLancamentos() {
  try {
    const res = await fetch(`${API}/lancamentos`, { headers: { 'x-token': token } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao buscar lançamentos.');
    lancamentosCache = data.lancamentos || [];
    renderizarLancamentos();
  } catch (e) {
    console.error(e);
    mostrarErro('Não foi possível carregar os lançamentos.');
  }
}

function renderizarLancamentos() {
  let saldo = 0;
  let totais = { entrada: 0, fixo: 0, superfluo: 0, diaadia: 0, imprevisto: 0 };

  lancamentosCache.forEach(l => {
    const valor = Number(l.valor);
    if (l.tipo_movimento === 'entrada') {
      saldo += valor;
      totais.entrada += valor;
    } else {
      saldo -= valor;
      if (totais[l.categoria] !== undefined) totais[l.categoria] += valor;
    }
  });

  const saldoEl = document.getElementById('saldoValor');
  saldoEl.textContent = formatarMoeda(saldo);
  saldoEl.className = 'valor ' + (saldo < 0 ? 'negativo' : 'positivo');

  document.getElementById('totalEntrada').textContent = formatarMoeda(totais.entrada);
  document.getElementById('totalFixo').textContent = formatarMoeda(totais.fixo);
  document.getElementById('totalSuperfluo').textContent = formatarMoeda(totais.superfluo);
  document.getElementById('totalDiaadia').textContent = formatarMoeda(totais.diaadia);
  document.getElementById('totalImprevisto').textContent = formatarMoeda(totais.imprevisto);

  const cores = { entrada: 'var(--entrada)', fixo: 'var(--fixo)', superfluo: 'var(--superfluo)', diaadia: 'var(--diaadia)', imprevisto: 'var(--imprevisto)' };
  const lista = document.getElementById('listaLancamentos');
  const titulo = document.getElementById('tituloListaLanc');

  let itensExibir = lancamentosCache;
  if (filtroAtivo) {
    itensExibir = itensExibir.filter(l =>
      filtroAtivo === 'entrada' ? l.tipo_movimento === 'entrada' : l.categoria === filtroAtivo
    );
  }
  if (buscaTexto) {
    const alvo = normalizarBusca(buscaTexto);
    itensExibir = itensExibir.filter(l =>
      normalizarBusca(l.descricao).includes(alvo) || (l.observacao && normalizarBusca(l.observacao).includes(alvo))
    );
  }

  if (filtroAtivo && buscaTexto) {
    titulo.textContent = `${NOMES_FILTRO[filtroAtivo]} · "${buscaTexto}"`;
  } else if (filtroAtivo) {
    titulo.textContent = NOMES_FILTRO[filtroAtivo];
  } else if (buscaTexto) {
    titulo.textContent = `Resultados de "${buscaTexto}"`;
  } else {
    titulo.textContent = 'Todos os lançamentos';
  }

  if (itensExibir.length === 0) {
    lista.innerHTML = `<div class="vazio">${(filtroAtivo || buscaTexto) ? 'Nada encontrado.' : 'Nenhum lançamento neste mês ainda.'}</div>` + renderizarPendenciasFantasmas();
    return;
  }

  const itensHtml = itensExibir.map(l => {
    const cor = l.tipo_movimento === 'entrada' ? cores.entrada : (cores[l.categoria] || cores.imprevisto);
    const classeValor = l.tipo_movimento === 'entrada' ? 'entrada' : 'saida';
    const sinal = l.tipo_movimento === 'entrada' ? '+' : '-';
    const parcelaInfo = l.total_parcelas ? ` (${l.parcela_atual}/${l.total_parcelas})` : '';
    const ehSaida = l.tipo_movimento === 'saida';
    return `
      <div class="item-wrap">
        <div class="item" onclick="alternarAcoesLancamento(${l.id})">
          <span class="dot" style="background:${cor}"></span>
          <div class="info">
            <div class="desc">${escapeHtml(l.descricao)}${parcelaInfo}</div>
            ${l.observacao ? `<div class="obs">${escapeHtml(l.observacao)}</div>` : ''}
            <div class="data">${formatarData(l.data_lancamento)}</div>
          </div>
          <div class="valor ${classeValor}">${sinal}${formatarMoeda(l.valor)}</div>
        </div>
        <div class="acoes-lanc" id="acoesLanc${l.id}">
          <button onclick="alternarEditarLancamento(${l.id})">✎ Editar</button>
          <button class="excluir" onclick="solicitarExclusaoLancamento(${l.id})">🗑 Excluir</button>
        </div>
        <div class="editar-lanc" id="editarLanc${l.id}">
          <input type="text" id="editDesc${l.id}" value="${escapeParaAtributo(l.descricao)}" placeholder="Descrição">
          <input type="text" id="editObs${l.id}" value="${escapeParaAtributo(l.observacao || '')}" placeholder="Observação (opcional)">
          <input type="text" id="editValor${l.id}" value="${String(l.valor).replace('.', ',')}" placeholder="Valor" inputmode="decimal">
          ${ehSaida ? `
            <select id="editCategoria${l.id}">
              <option value="fixo" ${l.categoria === 'fixo' ? 'selected' : ''}>Fixo</option>
              <option value="superfluo" ${l.categoria === 'superfluo' ? 'selected' : ''}>Supérfluo</option>
              <option value="diaadia" ${l.categoria === 'diaadia' ? 'selected' : ''}>Dia a dia</option>
              <option value="imprevisto" ${l.categoria === 'imprevisto' ? 'selected' : ''}>Imprevisto</option>
            </select>
            <select id="editForma${l.id}">
              <option value="dinheiro" ${l.forma_pagamento === 'dinheiro' ? 'selected' : ''}>Dinheiro</option>
              <option value="pix" ${l.forma_pagamento === 'pix' ? 'selected' : ''}>Pix</option>
              <option value="debito" ${l.forma_pagamento === 'debito' ? 'selected' : ''}>Débito</option>
              <option value="credito" ${l.forma_pagamento === 'credito' ? 'selected' : ''}>Crédito</option>
            </select>
          ` : ''}
          <button class="salvar-edicao" onclick="solicitarSalvarEdicao(${l.id})">Salvar alteração</button>
        </div>
      </div>
    `;
  }).join('');

  let totalHtml = '';
  if (filtroAtivo || buscaTexto) {
    const totalFiltro = itensExibir.reduce((soma, l) => soma + Number(l.valor), 0);
    const corFiltro = filtroAtivo ? cores[filtroAtivo] : 'var(--ink)';
    const labelTotal = filtroAtivo && buscaTexto ? `${NOMES_FILTRO[filtroAtivo]} · "${buscaTexto}"` : (filtroAtivo ? NOMES_FILTRO[filtroAtivo] : `"${buscaTexto}"`);
    totalHtml = `<div class="total-filtro" style="background:${corFiltro}; border-color:${corFiltro};">Total de ${labelTotal}: <span>${formatarMoeda(totalFiltro)}</span></div>`;
  }

  lista.innerHTML = itensHtml + totalHtml + renderizarPendenciasFantasmas();
}

// Pendencias recorrentes (aluguel, assinatura etc) que ainda nao foram pagas
// aparecem aqui na aba Lancamentos tambem - marcadas como "ainda nao pago",
// mas SEM entrar na soma do saldo/totais ate a pessoa confirmar o pagamento
// de verdade na aba A Pagar & Receber.
function categoriaFantasma(p) {
  return p.tipo === 'pagar' ? 'fixo' : 'entrada';
}

function renderizarPendenciasFantasmas() {
  const recorrentes = pendenciasCache.filter(p => p.recorrente);
  if (recorrentes.length === 0) return '';

  let relevantes = recorrentes.filter(p => !filtroAtivo || filtroAtivo === categoriaFantasma(p));
  if (buscaTexto) {
    const alvo = normalizarBusca(buscaTexto);
    relevantes = relevantes.filter(p => normalizarBusca(p.nome).includes(alvo));
  }
  if (relevantes.length === 0) return '';

  const itens = relevantes.map(p => {
    const estado = estadoPendencia(p);
    let classeEstado = '';
    if (estado === 'vencida' || estado === 'hoje-pagar') classeEstado = 'vencida';
    else if (estado === 'hoje-receber') classeEstado = 'hoje-receber';
    else if (estado === 'proxima-pagar') classeEstado = 'proxima-pagar';
    else if (estado === 'proxima-receber') classeEstado = 'proxima-receber';

    const cor = p.tipo === 'pagar' ? 'var(--fixo)' : 'var(--entrada)';
    const valorTexto = p.valor ? formatarMoeda(p.valor) : 'valor a definir';
    const sinal = p.tipo === 'pagar' ? '-' : '+';

    return `
      <div class="item fantasma ${classeEstado}">
        <span class="dot" style="background:${cor}"></span>
        <div class="info">
          <div class="desc">${escapeHtml(p.nome)}<span class="badge-fantasma">🕓 ainda não pago</span></div>
          <div class="data">Vence ${formatarDataVencimento(p.data_vencimento)}</div>
        </div>
        <div class="valor fantasma-valor">${sinal}${valorTexto}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="secao-titulo" style="margin-top:12px; margin-bottom:8px;">🕓 Programado (não debitado ainda)</div>
    <div class="lista">${itens}</div>
  `;
}

async function carregarPendencias() {
  try {
    const res = await fetch(`${API}/pendencias`, { headers: { 'x-token': token } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao buscar pendências.');
    pendenciasCache = data.pendencias || [];
    renderizarPendencias();
    renderizarLancamentos();
  } catch (e) {
    console.error(e);
    mostrarErro('Não foi possível carregar as pendências.');
  }
}

function estadoPendencia(p) {
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  const venc = paraDataLocal(p.data_vencimento);
  const diffDias = Math.round((venc.getTime() - hoje.getTime()) / 86400000);

  if (diffDias < 0) return 'vencida';
  if (diffDias === 0) return p.tipo === 'pagar' ? 'hoje-pagar' : 'hoje-receber';
  if (diffDias <= 2) return p.tipo === 'pagar' ? 'proxima-pagar' : 'proxima-receber';
  return 'normal';
}

function renderizarPendencias() {
  const aPagar = pendenciasCache.filter(p => p.tipo === 'pagar');
  const aReceber = pendenciasCache.filter(p => p.tipo === 'receber');

  const listaPagar = document.getElementById('listaPagar');
  const listaReceber = document.getElementById('listaReceber');

  listaPagar.innerHTML = aPagar.length
    ? aPagar.map(p => renderizarPendenciaCard(p)).join('')
    : '<div class="vazio">Nada a pagar.</div>';

  listaReceber.innerHTML = aReceber.length
    ? aReceber.map(p => renderizarPendenciaCard(p)).join('')
    : '<div class="vazio">Nada a receber.</div>';
}

function renderizarPendenciaCard(p) {
  const estado = estadoPendencia(p);
  const labelAcao = p.tipo === 'pagar' ? 'Paguei' : 'Recebi';
  const valorTexto = p.valor ? formatarMoeda(p.valor) : 'Valor não informado';
  const badgeRecorrente = p.recorrente ? ' 🔁' : '';

  let classeCard = '';
  let badgeEstado = '';
  if (estado === 'vencida') {
    classeCard = 'vencida';
    badgeEstado = '<div class="badge-estado">VENCIDA</div>';
  } else if (estado === 'hoje-pagar') {
    classeCard = 'vencida';
    badgeEstado = '<div class="badge-estado">VENCE HOJE</div>';
  } else if (estado === 'hoje-receber') {
    classeCard = 'hoje-receber';
    badgeEstado = '<div class="badge-estado">HOJE</div>';
  } else if (estado === 'proxima-pagar') {
    classeCard = 'proxima-pagar';
    badgeEstado = '<div class="badge-estado" style="color:var(--accent-dark);">VENCE EM BREVE</div>';
  } else if (estado === 'proxima-receber') {
    classeCard = 'proxima-receber';
    badgeEstado = '<div class="badge-estado" style="color:var(--entrada);">A RECEBER EM BREVE</div>';
  }

  return `
    <div class="pendencia-card ${classeCard}">
      <div class="linha-topo">
        <div class="nome">${escapeHtml(p.nome)}${badgeRecorrente}</div>
        <div class="data">${formatarDataVencimento(p.data_vencimento)}</div>
      </div>
      ${badgeEstado}
      <div class="valor">${valorTexto}</div>
      <div class="acoes">
        <button class="resolver" onclick="abrirResolverForm(${p.id})">${labelAcao}</button>
        <button class="excluir" onclick="solicitarExclusao(${p.id})">Excluir</button>
      </div>
      <div class="resolver-form" id="resolverForm${p.id}">
        <input type="text" id="resolverValor${p.id}" placeholder="Valor" inputmode="decimal" value="${p.valor || ''}">
        ${p.tipo === 'pagar' ? `
          <div class="pay-row" id="payRow${p.id}">
            <div data-forma="dinheiro" onclick="selecionarFormaPend(${p.id}, 'dinheiro')">Dinheiro</div>
            <div data-forma="pix" onclick="selecionarFormaPend(${p.id}, 'pix')">Pix</div>
            <div data-forma="debito" onclick="selecionarFormaPend(${p.id}, 'debito')">Débito</div>
            <div data-forma="credito" onclick="selecionarFormaPend(${p.id}, 'credito')">Crédito</div>
          </div>
          <select id="parcelasResolver${p.id}" style="display:none;">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
            <option value="5">5x</option>
            <option value="6">6x</option>
            <option value="10">10x</option>
            <option value="12">12x</option>
          </select>
          ${!p.recorrente ? `
            <select id="resolverCategoria${p.id}">
              <option value="fixo">Fixo</option>
              <option value="superfluo">Supérfluo</option>
              <option value="diaadia">Dia a dia</option>
              <option value="imprevisto" selected>Imprevisto</option>
            </select>
          ` : ''}
        ` : ''}
        <button class="confirmar" onclick="solicitarConfirmacaoResolucao(${p.id}, '${p.tipo}')">Confirmar</button>
      </div>
    </div>
  `;
}

function abrirResolverForm(id) {
  const form = document.getElementById(`resolverForm${id}`);
  form.classList.toggle('visivel');
}

function selecionarFormaPend(id, forma) {
  const row = document.getElementById(`payRow${id}`);
  row.dataset.formaEscolhida = forma;
  Array.from(row.children).forEach(el => {
    el.classList.toggle('active', el.dataset.forma === forma);
  });
  const parcelasSelect = document.getElementById(`parcelasResolver${id}`);
  if (parcelasSelect) {
    parcelasSelect.style.display = forma === 'credito' ? 'block' : 'none';
  }
}

function solicitarConfirmacaoResolucao(id, tipo) {
  const p = pendenciasCache.find(x => x.id === id);
  if (!p) return;

  const valorInput = document.getElementById(`resolverValor${id}`).value;
  const valorNum = paraNumero(valorInput);
  if (!valorInput || !valorNum || valorNum <= 0) {
    mostrarErro('Digite um valor válido.');
    return;
  }

  const body = { valor: valorNum };
  let formaTexto = '';
  let parcelasTexto = '';

  if (tipo === 'pagar') {
    const row = document.getElementById(`payRow${id}`);
    const forma = row ? row.dataset.formaEscolhida : null;
    if (!forma) {
      mostrarErro('Escolha a forma de pagamento.');
      return;
    }
    body.forma_pagamento = forma;
    const categoriaSelect = document.getElementById(`resolverCategoria${id}`);
    body.categoria = categoriaSelect ? categoriaSelect.value : undefined;

    const nomesForma = { dinheiro: 'Dinheiro', pix: 'Pix', debito: 'Débito', credito: 'Crédito' };
    formaTexto = ` via ${nomesForma[forma]}`;

    if (forma === 'credito') {
      const parcelasSelect = document.getElementById(`parcelasResolver${id}`);
      const totalParcelas = parcelasSelect ? parcelasSelect.value : '1';
      body.parcelas = totalParcelas;
      if (Number(totalParcelas) > 1) {
        parcelasTexto = ` em ${totalParcelas}x`;
      }
    }
  }

  const acaoLabel = tipo === 'pagar' ? 'pagamento' : 'recebimento';
  const verbo = tipo === 'pagar' ? 'Paguei' : 'Recebi';
  const mensagem = `Confirma o ${acaoLabel} de "${p.nome}" no valor de ${formatarMoeda(valorNum)}${formaTexto}${parcelasTexto}? Isso vai gerar o lançamento na sua planilha.`;

  abrirModal(`Confirmar ${acaoLabel}`, mensagem, verbo, 'var(--entrada)', () => confirmarResolucao(id, tipo, body));
}

async function confirmarResolucao(id, tipo, body) {
  try {
    const res = await fetch(`${API}/pendencias/${id}/resolver`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token': token },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao concluir.');
    mostrarToast(tipo === 'pagar' ? 'Marcado como pago ✓' : 'Marcado como recebido ✓');
    await carregarTudo();
  } catch (e) {
    mostrarErro(e.message);
  }
}

function solicitarExclusao(id) {
  const p = pendenciasCache.find(x => x.id === id);
  if (!p) return;

  const mensagem = p.recorrente
    ? `"${p.nome}" é um cadastro recorrente (repete todo mês). Ao excluir, esse cadastro será removido definitivamente e não será mais gerado nos próximos meses. Esta ação não pode ser desfeita.`
    : `Deseja excluir "${p.nome}"? Esta ação não pode ser desfeita.`;

  abrirModal('Excluir pendência', mensagem, 'Excluir', 'var(--erro)', () => excluirPendencia(id));
}

async function excluirPendencia(id) {
  try {
    const res = await fetch(`${API}/pendencias/${id}`, {
      method: 'DELETE',
      headers: { 'x-token': token }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao excluir.');
    mostrarToast('Excluído.');
    await carregarPendencias();
  } catch (e) {
    mostrarErro(e.message);
  }
}

async function salvarPendencia() {
  const nome = document.getElementById('pendNome').value.trim();
  const data_vencimento = document.getElementById('pendData').value;
  const valorInput = document.getElementById('pendValor').value.trim();
  const valorNum = valorInput ? paraNumero(valorInput) : null;

  if (!nome) {
    mostrarErro('Digite o nome da conta.');
    return;
  }
  if (!data_vencimento) {
    mostrarErro('Escolha a data de vencimento.');
    return;
  }
  if (valorInput && (isNaN(valorNum) || valorNum <= 0)) {
    mostrarErro('Valor inválido.');
    return;
  }

  try {
    const res = await fetch(`${API}/pendencias`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token': token },
      body: JSON.stringify({
        tipo: tipoPendenciaAtual,
        nome,
        data_vencimento,
        valor: valorNum || undefined,
        recorrente: recorrenteAtivo
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao salvar.');

    document.getElementById('pendNome').value = '';
    document.getElementById('pendValor').value = '';
    recorrenteAtivo = false;
    document.getElementById('btnRecorrente').classList.remove('ativo');
    document.getElementById('formPendencia').classList.remove('visivel');
    mostrarToast('Pendência criada ✓');
    await carregarPendencias();
  } catch (e) {
    mostrarErro(e.message);
  }
}

function escapeHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

function escapeParaAtributo(texto) {
  return String(texto)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function alternarAcoesLancamento(id) {
  document.getElementById(`acoesLanc${id}`).classList.toggle('visivel');
}

function alternarEditarLancamento(id) {
  document.getElementById(`editarLanc${id}`).classList.toggle('visivel');
}

function solicitarExclusaoLancamento(id) {
  const l = lancamentosCache.find(x => x.id === id);
  if (!l) return;
  abrirModal(
    'Excluir lançamento',
    `Deseja excluir "${l.descricao}" (${formatarMoeda(l.valor)})? Essa ação não pode ser desfeita.`,
    'Excluir',
    'var(--erro)',
    () => excluirLancamento(id)
  );
}

async function excluirLancamento(id) {
  try {
    const res = await fetch(`${API}/lancamentos/${id}`, {
      method: 'DELETE',
      headers: { 'x-token': token }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao excluir.');
    mostrarToast('Lançamento excluído.');
    await carregarLancamentos();
  } catch (e) {
    mostrarErro(e.message);
  }
}

function solicitarSalvarEdicao(id) {
  const l = lancamentosCache.find(x => x.id === id);
  if (!l) return;

  const descricao = document.getElementById(`editDesc${id}`).value.trim();
  const observacao = document.getElementById(`editObs${id}`).value.trim();
  const valorInput = document.getElementById(`editValor${id}`).value;
  const valorNum = paraNumero(valorInput);

  if (!descricao) {
    mostrarErro('Digite a descrição.');
    return;
  }
  if (!valorInput || !valorNum || valorNum <= 0) {
    mostrarErro('Digite um valor válido.');
    return;
  }

  const body = { descricao, observacao: observacao || undefined, valor: valorNum };
  if (l.tipo_movimento === 'saida') {
    body.categoria = document.getElementById(`editCategoria${id}`).value;
    body.forma_pagamento = document.getElementById(`editForma${id}`).value;
  }

  abrirModal(
    'Salvar alteração',
    `Confirma a alteração desse lançamento pra "${descricao}" (${formatarMoeda(valorNum)})?`,
    'Salvar',
    'var(--entrada)',
    () => salvarEdicaoLancamento(id, body)
  );
}

async function salvarEdicaoLancamento(id, body) {
  try {
    const res = await fetch(`${API}/lancamentos/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-token': token },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao editar.');
    mostrarToast('Lançamento atualizado ✓');
    await carregarLancamentos();
  } catch (e) {
    mostrarErro(e.message);
  }
}

carregarTudo();
</script>
