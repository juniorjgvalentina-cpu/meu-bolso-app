<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<title>Meu Bolso — Entrando...</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;800&display=swap');
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
body{
  background:#FFFFFF; height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:19px; color:#16261F; }
.msg{ font-size:13.5px; color:#3C4B43; max-width:280px; line-height:1.5; }
.spinner{
  width:32px; height:32px; border:3px solid #E4DFD1; border-top-color:#16261F; border-radius:50%;
  animation:girar 0.8s linear infinite;
}
@keyframes girar{ to{ transform:rotate(360deg); } }
.erro{ color:#D64545; font-weight:700; }
</style>
</head>
<body>

<div class="spinner" id="spinner"></div>
<div class="titulo">Meu Bolso</div>
<div class="msg" id="mensagem">Entrando na sua conta...</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('mensagem').innerHTML = '<span class="erro">Link inválido.</span><br>Peça pra quem te convidou mandar o link de novo.';
} else {
  localStorage.setItem('meubolso_token', token);
  setTimeout(() => {
    window.location.href = '/home.html';
  }, 600);
}
</script>
</body>
</html>
