<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meu Bolso</title>
<style>
:root{
  --ink:#16261F;
  --ink-soft:#3C4B43;
  --paper:#FAF7F0;
  --paper-dim:#F0ECE1;
  --card:#FFFFFF;
  --accent:#E8622C;
  --accent-dark:#C64F1E;
  --line:#E4DFD1;
  --erro:#D64545;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body{
  background:var(--paper);
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.wrap{
  flex:1;
  max-width:440px;
  width:100%;
  margin:0 auto;
  padding:48px 22px 40px;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.brand-mark{
  width:52px; height:52px; border-radius:16px;
  background:linear-gradient(135deg, var(--accent), var(--accent-dark));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:800; font-size:22px;
  margin-bottom:4px;
}
h1{ font-size:22px; font-weight:800; line-height:1.3; letter-spacing:-.01em; }
p.desc{ color:var(--ink-soft); font-size:13.5px; line-height:1.5; }

.field{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:13px 15px;
}
.field label{
  display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:#A39B85; font-weight:700; margin-bottom:4px;
}
.field input{
  border:none; outline:none; width:100%; font-size:15px; font-weight:600;
  color:var(--ink); background:transparent; font-family:inherit;
}
.field input::placeholder{ color:#C8C2AF; font-weight:500; }

.planos{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
.plano-card{
  background:var(--card); border:1.5px solid var(--line); border-radius:14px;
  padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
  cursor:pointer;
}
.plano-card.selected{ border-color:var(--accent); background:#FEF2ED; }
.plano-nome{ font-weight:700; font-size:14.5px; }
.plano-detalhe{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.plano-preco{ font-weight:800; font-size:15px; color:var(--accent-dark); white-space:nowrap; }

.btn-primary{
  background:var(--ink); color:var(--paper); text-align:center; padding:16px;
  border-radius:14px; font-weight:700; font-size:14.5px; border:none;
  width:100%; margin-top:6px;
}
.btn-primary:disabled{ opacity:.55; }

.erro-msg{
  background:#FBEAEA; color:var(--erro); font-size:12.5px; font-weight:600;
  padding:10px 14px; border-radius:10px; display:none;
}
.trial-chip{
  align-self:flex-start;
  background:#EAF5EE; color:#2F9E68;
  font-size:11px; font-weight:700; padding:6px 12px; border-radius:100px;
}
.loading-screen{
  position:fixed; inset:0; background:var(--paper); display:flex;
  align-items:center; justify-content:center; font-size:13px; color:var(--ink-soft);
}
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">Carregando...</div>

<div class="wrap" id="cadastroForm" style="display:none;">
  <div class="brand-mark">$</div>
  <h1>Vamos começar. Só precisa disso uma vez.</h1>
  <p class="desc">Depois do cadastro, o app abre direto — sem senha, sem login toda vez.</p>
  <div class="trial-chip">4 dias grátis pra testar</div>

  <div class="field">
    <label>Nome</label>
    <input type="text" id="inputNome" placeholder="Como podemos te chamar?" autocomplete="name">
  </div>

  <div class="field">
    <label>Telefone</label>
    <input type="tel" id="inputTelefone" placeholder="(11) 98765-4321" autocomplete="tel">
  </div>

  <div>
    <label style="display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#A39B85; font-weight:700; margin-bottom:8px;">Escolha o plano</label>
    <div class="planos" id="planosContainer">
      <div class="plano-card selected" data-plano="individual">
        <div>
          <div class="plano-nome">Individual</div>
          <div class="plano-detalhe">1 login</div>
        </div>
        <div class="plano-preco">R$12,99</div>
      </div>
      <div class="plano-card" data-plano="casal">
        <div>
          <div class="plano-nome">Casal</div>
          <div class="plano-detalhe">2 logins compartilhados</div>
        </div>
        <div class="plano-preco">R$14,99</div>
      </div>
      <div class="plano-card" data-plano="familia">
        <div>
          <div class="plano-nome">Família</div>
          <div class="plano-detalhe">até 6 logins compartilhados</div>
        </div>
        <div class="plano-preco">R$17,99</div>
      </div>
    </div>
  </div>

  <div class="erro-msg" id="erroMsg"></div>

  <button class="btn-primary" id="btnCriar">Criar minha conta</button>
</div>

<script>
const API = '/api';

function mostrarErro(msg) {
  const el = document.getElementById('erroMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function esconderErro() {
  document.getElementById('erroMsg').style.display = 'none';
}

async function tentarLoginAutomatico() {
  const token = localStorage.getItem('meubolso_token');
  if (!token) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('cadastroForm').style.display = 'flex';
    return;
  }
  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    if (res.ok) {
      window.location.href = '/home.html';
      return;
    }
    localStorage.removeItem('meubolso_token');
  } catch (e) {
    console.error('Erro ao verificar login:', e);
  }
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('cadastroForm').style.display = 'flex';
}

let planoSelecionado = 'individual';

document.querySelectorAll('.plano-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.plano-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    planoSelecionado = card.dataset.plano;
  });
});

document.getElementById('btnCriar').addEventListener('click', async () => {
  esconderErro();
  const nome = document.getElementById('inputNome').value.trim();
  const telefone = document.getElementById('inputTelefone').value.trim();

  if (!nome) {
    mostrarErro('Digite seu nome pra continuar.');
    return;
  }
  if (!telefone || telefone.replace(/\D/g, '').length < 10) {
    mostrarErro('Digite um telefone válido com DDD.');
    return;
  }

  const btn = document.getElementById('btnCriar');
  btn.disabled = true;
  btn.textContent = 'Criando...';

  try {
    const res = await fetch(`${API}/cadastro`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome, telefone, plano: planoSelecionado })
    });
    const data = await res.json();

    if (!res.ok) {
      mostrarErro(data.erro || 'Erro ao criar cadastro. Tente novamente.');
      btn.disabled = false;
      btn.textContent = 'Criar minha conta';
      return;
    }

    localStorage.setItem('meubolso_token', data.token);
    window.location.href = '/home.html';
  } catch (e) {
    console.error('Erro no cadastro:', e);
    mostrarErro('Não conseguimos conectar. Verifique sua internet e tente de novo.');
    btn.disabled = false;
    btn.textContent = 'Criar minha conta';
  }
});

tentarLoginAutomatico();
</script>
</body>
</html>
