<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.json">
<title>Meu Bolso — Relatório</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --ink:#16261F;
  --ink-soft:#3C4B43;
  --paper:#FAF7F0;
  --paper-dim:#F0ECE1;
  --card:#FFFFFF;
  --accent:#E8622C;
  --accent-dark:#C64F1E;
  --line:#E4DFD1;
  --fixo:#2F6FED;
  --superfluo:#E8922C;
  --imprevisto:#D64545;
  --entrada:#2F9E68;
  --erro:#D64545;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html{ touch-action:manipulation; }
html, body{ height:100%; }
body{
  background:#FFFFFF;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:var(--ink);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom);
  padding-top:env(safe-area-inset-top);
}
.topbar{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:14px 20px 10px;
  max-width:460px; margin:0 auto; width:100%;
  flex-shrink:0;
}
.topbar h1{ font-family:'Sora', sans-serif; font-weight:800; font-size:16px; flex:1; text-align:center; }
.nav-btn{
  width:38px; height:38px; border-radius:11px; background:var(--card);
  border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--ink-soft); flex-shrink:0; transition:transform .1s;
}
.nav-btn:active{ transform:scale(0.9); background:var(--paper-dim); }
.wrap{
  max-width:460px; margin:0 auto; width:100%;
  padding:6px 20px 24px; display:flex; flex-direction:column; gap:16px;
  flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain;
}

.secao{ border:1.5px solid var(--ink); border-radius:16px; padding:16px; }
.secao-titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:12.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px; }

.rapidos{ display:flex; flex-wrap:wrap; gap:8px; }
.rapidos button{
  padding:9px 13px; border-radius:100px; border:1.5px solid var(--ink); background:var(--card);
  font-family:'Sora', sans-serif; font-weight:700; font-size:12px; color:var(--ink-soft);
}
.rapidos button.ativo{ background:var(--ink); color:#fff; }

.campos-data{ display:flex; gap:10px; margin-top:14px; }
.campo-data{ flex:1; display:flex; flex-direction:column; gap:6px; }
.campo-data label{ font-size:11px; font-weight:700; color:var(--ink-soft); }
.campo-data .selects-row{ display:flex; gap:6px; }
.campo-data select{
  flex:1; min-width:0; border:1.5px solid var(--ink); border-radius:11px; padding:10px 6px; font-size:12.5px;
  font-family:'JetBrains Mono', monospace; color:var(--ink); background:var(--card);
}

.aviso-periodo{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; }
.aviso-periodo.erro{ color:var(--erro); font-weight:600; }

.btn-baixar{
  background:linear-gradient(135deg, var(--accent), var(--accent-dark));
  color:#fff; text-align:center; padding:15px; border-radius:15px;
  font-family:'Sora', sans-serif; font-weight:800; font-size:14px; border:1.5px solid var(--ink); width:100%;
  box-shadow:0 12px 24px -8px rgba(232,98,44,.5);
}
.btn-baixar:disabled{ opacity:.5; }

.info-box{
  background:var(--paper-dim); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
  font-size:12px; color:var(--ink-soft); line-height:1.5;
}

.erro-msg{
  background:#FBEAEA; color:var(--erro); font-size:12.5px; font-weight:600;
  padding:10px 14px; border-radius:10px; display:none;
}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:100px;
  font-family:'Sora', sans-serif; font-size:13px; font-weight:600; display:none; white-space:nowrap; z-index:10;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="nav-btn" onclick="window.location.href='/planilha.html'">←</div>
  <h1>Relatório PDF</h1>
  <div class="nav-btn" style="visibility:hidden;">🔄</div>
</div>

<div class="wrap">

  <div class="erro-msg" id="erroMsg"></div>

  <div class="secao">
    <div class="secao-titulo">Período rápido</div>
    <div class="rapidos" id="rapidosRow">
      <button onclick="selecionarRapido('este-mes')">Este mês</button>
      <button onclick="selecionarRapido('mes-passado')">Mês passado</button>
      <button onclick="selecionarRapido('3-meses')">Últimos 3 meses</button>
      <button onclick="selecionarRapido('6-meses')">Últimos 6 meses</button>
      <button onclick="selecionarRapido('ano')">Este ano</button>
    </div>
  </div>

  <div class="secao">
    <div class="secao-titulo">Ou escolha o período</div>
    <div class="campos-data">
      <div class="campo-data">
        <label>De</label>
        <div class="selects-row">
          <select id="selectMesInicio"></select>
          <select id="selectAnoInicio"></select>
        </div>
      </div>
      <div class="campo-data">
        <label>Até</label>
        <div class="selects-row">
          <select id="selectMesFim"></select>
          <select id="selectAnoFim"></select>
        </div>
      </div>
    </div>
    <div class="aviso-periodo" id="avisoPeriodo"></div>
  </div>

  <div class="info-box">
    O PDF traz uma folha por mês, colorida por categoria (🟢Entrada 🔵Fixo 🟠Supérfluo 🟡Dia a dia 🔴Imprevisto), com o resumo de cada mês. Se o período tiver mais de um mês, uma folha extra no final soma tudo.
  </div>

  <button class="btn-baixar" id="btnBaixar" onclick="baixarPdf()">Baixar PDF →</button>

</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
const token = localStorage.getItem('meubolso_token');

if (!token) {
  window.location.href = '/index.html';
}

const NOMES_MESES_CURTO = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

function popularSelects() {
  const anoAtual = new Date().getFullYear();
  ['Inicio', 'Fim'].forEach(prefixo => {
    const selMes = document.getElementById(`selectMes${prefixo}`);
    NOMES_MESES_CURTO.forEach((nome, i) => {
      const val = String(i + 1).padStart(2, '0');
      selMes.innerHTML += `<option value="${val}">${nome}</option>`;
    });

    const selAno = document.getElementById(`selectAno${prefixo}`);
    for (let a = anoAtual - 3; a <= anoAtual + 1; a++) {
      selAno.innerHTML += `<option value="${a}">${a}</option>`;
    }
  });
}

function mesAtualISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function somarMesesISO(mesISO, delta) {
  let [ano, mes] = mesISO.split('-').map(Number);
  mes += delta;
  while (mes < 1) { mes += 12; ano--; }
  while (mes > 12) { mes -= 12; ano++; }
  return `${ano}-${String(mes).padStart(2, '0')}`;
}

function obterMesISO(prefixo) {
  const mes = document.getElementById(`selectMes${prefixo}`).value;
  const ano = document.getElementById(`selectAno${prefixo}`).value;
  return `${ano}-${mes}`;
}

function definirMesISO(prefixo, mesISO) {
  const [ano, mes] = mesISO.split('-');
  document.getElementById(`selectMes${prefixo}`).value = mes;
  document.getElementById(`selectAno${prefixo}`).value = ano;
}

popularSelects();
definirMesISO('Inicio', mesAtualISO());
definirMesISO('Fim', mesAtualISO());

function selecionarRapido(tipo) {
  const hoje = mesAtualISO();
  let inicio = hoje;
  let fim = hoje;

  if (tipo === 'mes-passado') {
    inicio = somarMesesISO(hoje, -1);
    fim = inicio;
  } else if (tipo === '3-meses') {
    inicio = somarMesesISO(hoje, -2);
  } else if (tipo === '6-meses') {
    inicio = somarMesesISO(hoje, -5);
  } else if (tipo === 'ano') {
    inicio = `${hoje.split('-')[0]}-01`;
  }

  definirMesISO('Inicio', inicio);
  definirMesISO('Fim', fim);

  Array.from(document.getElementById('rapidosRow').children).forEach(btn => btn.classList.remove('ativo'));
  event.target.classList.add('ativo');
  validarPeriodo();
}

['selectMesInicio', 'selectAnoInicio', 'selectMesFim', 'selectAnoFim'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    desmarcarRapidos();
    validarPeriodo();
  });
});

function desmarcarRapidos() {
  Array.from(document.getElementById('rapidosRow').children).forEach(btn => btn.classList.remove('ativo'));
}

function contarMeses(inicio, fim) {
  const [anoI, mesI] = inicio.split('-').map(Number);
  const [anoF, mesF] = fim.split('-').map(Number);
  return (anoF - anoI) * 12 + (mesF - mesI) + 1;
}

function validarPeriodo() {
  const inicio = obterMesISO('Inicio');
  const fim = obterMesISO('Fim');
  const aviso = document.getElementById('avisoPeriodo');
  const btn = document.getElementById('btnBaixar');

  const totalMeses = contarMeses(inicio, fim);

  if (totalMeses < 1) {
    aviso.textContent = 'A data final precisa ser igual ou depois da inicial.';
    aviso.className = 'aviso-periodo erro';
    btn.disabled = true;
  } else if (totalMeses > 12) {
    aviso.textContent = 'O período máximo é de 12 meses.';
    aviso.className = 'aviso-periodo erro';
    btn.disabled = true;
  } else {
    aviso.textContent = totalMeses === 1 ? '1 mês selecionado.' : `${totalMeses} meses selecionados.`;
    aviso.className = 'aviso-periodo';
    btn.disabled = false;
  }
}

function mostrarErro(msg) {
  const el = document.getElementById('erroMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function mostrarToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2200);
}

function baixarPdf() {
  const inicio = obterMesISO('Inicio');
  const fim = obterMesISO('Fim');

  const url = `${API}/relatorio/pdf?token=${encodeURIComponent(token)}&inicio=${inicio}&fim=${fim}`;
  mostrarToast('Gerando PDF...');
  window.location.href = url;
}

validarPeriodo();
</script>
</body>
</html>
