<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.json">
<title>Meu Bolso — Pagamento</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --ink:#16261F;
  --ink-soft:#3C4B43;
  --paper:#FAF7F0;
  --paper-dim:#F0ECE1;
  --card:#FFFFFF;
  --accent:#E8622C;
  --accent-dark:#C64F1E;
  --line:#E4DFD1;
  --entrada:#2F9E68;
  --erro:#D64545;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html{ touch-action:manipulation; }
html, body{ height:100%; }
body{
  background:#FFFFFF;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:var(--ink);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom);
}
.topbar{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:14px 20px 10px;
  max-width:460px; margin:0 auto; width:100%;
  flex-shrink:0;
}
.topbar h1{ font-family:'Sora', sans-serif; font-weight:800; font-size:16px; flex:1; text-align:center; }
.nav-btn{
  width:38px; height:38px; border-radius:11px; background:var(--card);
  border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--ink-soft); flex-shrink:0; transition:transform .1s;
}
.nav-btn:active{ transform:scale(0.9); background:var(--paper-dim); }
.wrap{
  max-width:460px; margin:0 auto; width:100%;
  padding:6px 20px 24px; display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center;
  flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain;
}

.aviso-vencido{
  width:100%; border:1.5px solid var(--erro); border-radius:16px; padding:14px; background:#FBEAEA;
}
.aviso-vencido .titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:13.5px; color:var(--erro); }
.aviso-vencido .texto{ font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.4; }

.valor-box{ margin-top:4px; }
.valor-box .label{ font-size:11.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.valor-box .valor{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:32px; margin-top:4px; }

.qr-box{
  width:220px; height:220px; border:1.5px solid var(--ink); border-radius:16px; padding:10px;
  display:flex; align-items:center; justify-content:center; background:var(--card);
}
.qr-box img{ width:100%; height:100%; object-fit:contain; }
.qr-carregando{ font-size:12px; color:var(--ink-soft); }

.copia-cola{
  width:100%; border:1.5px solid var(--ink); border-radius:13px; padding:12px;
  font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-soft); word-break:break-all; text-align:left;
  max-height:70px; overflow-y:auto; background:var(--paper-dim);
}

.btn-copiar{
  width:100%; padding:14px; border-radius:15px; border:1.5px solid var(--ink);
  font-family:'Sora', sans-serif; font-weight:800; font-size:13.5px; background:var(--card); color:var(--ink);
}

.status-aguardando{
  display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); margin-top:4px;
}
.spinner{
  width:16px; height:16px; border:2.5px solid var(--line); border-top-color:var(--ink); border-radius:50%;
  animation:girar .8s linear infinite;
}
@keyframes girar{ to{ transform:rotate(360deg); } }

.sucesso{ display:none; flex-direction:column; align-items:center; gap:14px; width:100%; }
.sucesso.visivel{ display:flex; }
.sucesso .icone{ font-size:52px; }
.sucesso .titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:19px; color:var(--entrada); }
.sucesso .texto{ font-size:13px; color:var(--ink-soft); }

.escondido{ display:none !important; }

.erro-msg{
  background:#FBEAEA; color:var(--erro); font-size:12.5px; font-weight:600;
  padding:10px 14px; border-radius:10px; display:none; width:100%;
}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:100px;
  font-family:'Sora', sans-serif; font-size:13px; font-weight:600; display:none; white-space:nowrap; z-index:10;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="nav-btn" onclick="window.location.href='/configuracoes.html'">←</div>
  <h1>Pagamento</h1>
  <div class="nav-btn" style="visibility:hidden;">🔄</div>
</div>

<div class="wrap" id="wrapConteudo">

  <div class="erro-msg" id="erroMsg"></div>

  <div class="aviso-vencido" id="avisoVencido">
    <div class="titulo">Assinatura vencida</div>
    <div class="texto">Pra continuar lançando gastos e usando o app, é só pagar essa cobrança via Pix.</div>
  </div>

  <div class="valor-box">
    <div class="label">Valor a pagar</div>
    <div class="valor" id="valorPagar">—</div>
  </div>

  <div class="qr-box" id="qrBox">
    <div class="qr-carregando" id="qrCarregando">Gerando o Pix...</div>
    <img id="qrImagem" class="escondido">
  </div>

  <div class="copia-cola" id="copiaCola">—</div>

  <button class="btn-copiar" onclick="copiarCodigo()">Copiar código Pix</button>

  <div class="status-aguardando">
    <div class="spinner"></div>
    <span>Aguardando confirmação do pagamento...</span>
  </div>

  <button class="btn-copiar" onclick="verificarStatus(true)">Já paguei, verificar agora</button>

  <div class="sucesso" id="sucessoBox">
    <div class="icone">✅</div>
    <div class="titulo">Pagamento confirmado!</div>
    <div class="texto">Sua assinatura já está ativa de novo. Redirecionando...</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
const token = localStorage.getItem('meubolso_token');

if (!token) {
  window.location.href = '/index.html';
}

let codigoPixAtual = '';
let intervaloChecagem = null;

function mostrarErro(msg) {
  const el = document.getElementById('erroMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function mostrarToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2200);
}

function formatarMoeda(valor) {
  return 'R$ ' + Number(valor).toFixed(2).replace('.', ',');
}

async function gerarPix() {
  try {
    const res = await fetch(`${API}/cobranca/gerar`, {
      method: 'POST',
      headers: { 'x-token': token }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao gerar o Pix.');

    if (data.ja_pago) {
      mostrarSucesso();
      return;
    }

    codigoPixAtual = data.qr_code;
    document.getElementById('valorPagar').textContent = formatarMoeda(data.valor);
    document.getElementById('copiaCola').textContent = data.qr_code;

    if (data.qr_code_base64) {
      const img = document.getElementById('qrImagem');
      img.src = `data:image/png;base64,${data.qr_code_base64}`;
      img.classList.remove('escondido');
      document.getElementById('qrCarregando').classList.add('escondido');
    }

    iniciarChecagem();
  } catch (e) {
    mostrarErro(e.message);
  }
}

function iniciarChecagem() {
  if (intervaloChecagem) clearInterval(intervaloChecagem);
  intervaloChecagem = setInterval(verificarStatus, 5000);
}

function mostrarSucesso() {
  if (intervaloChecagem) clearInterval(intervaloChecagem);
  document.getElementById('wrapConteudo').querySelectorAll(':scope > *:not(.sucesso)').forEach(el => {
    el.classList.add('escondido');
  });
  document.getElementById('sucessoBox').classList.add('visivel');
  setTimeout(() => {
    window.location.href = '/home.html';
  }, 2200);
}

async function verificarStatus(chamadoManualmente) {
  try {
    if (chamadoManualmente) mostrarToast('Verificando...');
    const res = await fetch(`${API}/cobranca/status`, { headers: { 'x-token': token } });
    const data = await res.json();
    if (!res.ok) return;

    if (data.status_assinatura === 'ativo') {
      mostrarSucesso();
    } else if (chamadoManualmente) {
      mostrarToast('Ainda não identificamos o pagamento. Aguarde alguns instantes.');
    }
  } catch (e) {
    console.error('Erro ao verificar status:', e);
  }
}

async function copiarCodigo() {
  if (!codigoPixAtual) return;
  try {
    await navigator.clipboard.writeText(codigoPixAtual);
    mostrarToast('Código copiado ✓');
  } catch (e) {
    mostrarToast('Não foi possível copiar. Selecione o texto manualmente.');
  }
}

gerarPix();
</script>
</body>
</html>
