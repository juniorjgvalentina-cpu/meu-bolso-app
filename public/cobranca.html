<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.json">
<title>Meu Bolso</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --ink:#16261F;
  --ink-soft:#3C4B43;
  --paper:#FAF7F0;
  --paper-dim:#F0ECE1;
  --card:#FFFFFF;
  --accent:#E8622C;
  --accent-dark:#C64F1E;
  --line:#E4DFD1;
  --fixo:#2F6FED;
  --superfluo:#E8922C;
  --imprevisto:#D64545;
  --entrada:#2F9E68;
  --erro:#D64545;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html{ touch-action:manipulation; }
html, body{ height:100%; }
body{
  background:#FFFFFF;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:var(--ink);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom);
}
.topbar{
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 20px 6px;
  max-width:460px; margin:0 auto; width:100%;
  flex-shrink:0;
}
.greet{ font-family:'Sora', sans-serif; font-weight:800; font-size:16px; }
.greet span{ display:block; font-weight:500; font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-family:-apple-system, sans-serif; }
.nav-btn{
  width:38px; height:38px; border-radius:11px; background:var(--card);
  border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--ink-soft);
}
.wrap{
  max-width:460px; margin:0 auto; width:100%;
  padding:6px 20px 14px; display:flex; flex-direction:column; gap:9px;
  flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain;
}

.amount-field{ text-align:center; padding:8px 10px 6px; }
.amount-field .cur{ font-family:'JetBrains Mono', monospace; font-size:12px; color:#A39B85; font-weight:700; }
.amount-field .big{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:38px; color:var(--ink); line-height:1.1; margin-top:2px; }

.numpad{ display:grid; grid-template-columns:repeat(3, 1fr); gap:7px; }
.numpad button{
  padding:11px 0; border-radius:13px; border:1.5px solid var(--ink); background:var(--card);
  font-family:'JetBrains Mono', monospace; font-size:18px; font-weight:700; color:var(--ink);
}
.numpad button.apagar{ color:var(--erro); font-size:15px; }

.desc-field{
  background:var(--card); border:1.5px solid var(--ink); border-radius:13px;
  padding:10px 14px; display:flex; align-items:center; gap:8px; position:relative;
}
.desc-field input{
  border:none; outline:none; flex:1; font-family:'Sora', sans-serif;
  font-weight:600; font-size:14.5px; color:var(--ink); background:transparent;
}
.desc-field input::placeholder{ color:#C8C2AF; font-weight:500; }

.sugestao-box{
  background:#FEF6EC; border:1px solid var(--superfluo); border-radius:12px;
  padding:12px 14px; font-size:12.5px; display:none;
}
.sugestao-box .btns{ display:flex; gap:8px; margin-top:8px; }
.sugestao-box button{
  flex:1; padding:8px; border-radius:9px; border:none; font-family:'Sora', sans-serif; font-weight:700; font-size:12px;
}
.sugestao-box .sim{ background:var(--ink); color:var(--paper); }
.sugestao-box .nao{ background:var(--paper-dim); color:var(--ink-soft); }

.tipo-row{ display:flex; gap:8px; }
.tipo-btn{
  flex:1; text-align:center; padding:15px 4px; border-radius:14px;
  font-family:'Sora', sans-serif; font-weight:700; font-size:12px; border:1.5px solid var(--ink); color:var(--ink-soft); background:var(--card);
}
.tipo-btn.fixo.selected{ border-color:var(--fixo); color:#fff; background:var(--fixo); }
.tipo-btn.superfluo.selected{ border-color:var(--superfluo); color:#fff; background:var(--superfluo); }
.tipo-btn.imprevisto.selected{ border-color:var(--imprevisto); color:#fff; background:var(--imprevisto); }

.tipo-auto-badge{
  display:none; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft);
  background:var(--card); border:1.5px solid var(--ink); border-radius:10px; padding:8px 12px;
}
.tipo-auto-badge .trocar{ margin-left:auto; color:var(--accent-dark); font-weight:700; }

.pay-row{ display:flex; gap:8px; }
.pay-chip{
  flex:1; text-align:center; padding:9px 2px; border-radius:10px;
  font-family:'Sora', sans-serif; font-size:10.5px; font-weight:700; background:var(--paper-dim); color:var(--ink-soft); border:1.5px solid var(--ink);
}
.pay-chip.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

.parcelas-box{ display:none; gap:8px; }
.parcelas-box select{
  flex:1; padding:11px; border-radius:11px; border:1.5px solid var(--ink);
  font-size:13px; font-weight:600; background:var(--card); color:var(--ink);
}

.entrada-toggle{
  display:flex; gap:8px; background:var(--paper-dim); padding:4px; border-radius:12px; border:1.5px solid var(--ink); flex-shrink:0;
}
.entrada-toggle button{
  flex:1; padding:9px; border-radius:9px; border:none; font-family:'Sora', sans-serif; font-weight:700; font-size:12px;
  background:transparent; color:var(--ink-soft);
}
#btnSaida.active{ background:var(--imprevisto); color:#fff; box-shadow:0 3px 8px -2px rgba(214,69,69,.5); }
#btnEntrada.active{ background:var(--entrada); color:#fff; box-shadow:0 3px 8px -2px rgba(47,158,104,.5); }

.btn-send{
  background:linear-gradient(135deg, var(--accent), var(--accent-dark));
  color:#fff; text-align:center; padding:14px; border-radius:15px;
  font-family:'Sora', sans-serif; font-weight:800; font-size:14px; border:1.5px solid var(--ink); width:100%;
  box-shadow:0 12px 24px -8px rgba(232,98,44,.5); flex-shrink:0;
}
.btn-send:disabled{ opacity:.5; }

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:100px;
  font-family:'Sora', sans-serif; font-size:13px; font-weight:600; display:none; white-space:nowrap;
}
.erro-msg{
  background:#FBEAEA; color:var(--erro); font-size:12.5px; font-weight:600;
  padding:10px 14px; border-radius:10px; display:none;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="greet" id="greetNome">Oi!<span id="greetData"></span></div>
  <div class="nav-btn" onclick="window.location.href='/planilha.html'">☰</div>
</div>

<div class="wrap">

  <div class="entrada-toggle">
    <button class="active" id="btnSaida" onclick="setMovimento('saida')">Gasto</button>
    <button id="btnEntrada" onclick="setMovimento('entrada')">Entrada</button>
  </div>

  <div class="amount-field">
    <div class="cur">R$</div>
    <div class="big" id="valorDisplay">0,00</div>
  </div>

  <div class="numpad">
    <button onclick="digitar('1')">1</button>
    <button onclick="digitar('2')">2</button>
    <button onclick="digitar('3')">3</button>
    <button onclick="digitar('4')">4</button>
    <button onclick="digitar('5')">5</button>
    <button onclick="digitar('6')">6</button>
    <button onclick="digitar('7')">7</button>
    <button onclick="digitar('8')">8</button>
    <button onclick="digitar('9')">9</button>
    <button onclick="digitar('00')">00</button>
    <button onclick="digitar('0')">0</button>
    <button class="apagar" onclick="apagar()">⌫</button>
  </div>

  <div class="desc-field">
    <input type="text" id="descricaoInput" placeholder="O que foi?" autocomplete="off">
  </div>

  <div class="sugestao-box" id="sugestaoBox">
    <span id="sugestaoTexto"></span>
    <div class="btns">
      <button class="sim" onclick="aceitarSugestao()">Sim, é isso</button>
      <button class="nao" onclick="recusarSugestao()">Não, é outro</button>
    </div>
  </div>

  <div class="tipo-auto-badge" id="tipoAutoBadge">
    <span id="tipoAutoTexto"></span>
    <span class="trocar" onclick="mostrarTiposManual()">trocar</span>
  </div>

  <div class="tipo-row" id="tipoRow" style="display:none;">
    <div class="tipo-btn fixo" onclick="selecionarTipo('fixo')">Fixo</div>
    <div class="tipo-btn superfluo" onclick="selecionarTipo('superfluo')">Supérfluo</div>
    <div class="tipo-btn imprevisto" onclick="selecionarTipo('imprevisto')">Imprevisto</div>
  </div>

  <div class="pay-row" id="payRow">
    <div class="pay-chip" data-forma="dinheiro" onclick="selecionarForma('dinheiro')">Dinheiro</div>
    <div class="pay-chip" data-forma="pix" onclick="selecionarForma('pix')">Pix</div>
    <div class="pay-chip" data-forma="debito" onclick="selecionarForma('debito')">Débito</div>
    <div class="pay-chip" data-forma="credito" onclick="selecionarForma('credito')">Crédito</div>
  </div>

  <div class="parcelas-box" id="parcelasBox">
    <select id="parcelasSelect">
      <option value="1">1x</option>
      <option value="2">2x</option>
      <option value="3">3x</option>
      <option value="4">4x</option>
      <option value="5">5x</option>
      <option value="6">6x</option>
      <option value="10">10x</option>
      <option value="12">12x</option>
    </select>
  </div>

  <div class="erro-msg" id="erroMsg"></div>

  <button class="btn-send" id="btnEnviar" onclick="enviarLancamento()">Enviar →</button>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
const token = localStorage.getItem('meubolso_token');

if (!token) {
  window.location.href = '/index.html';
}

let rawDigitos = '';
let movimento = 'saida';
let tipoSelecionado = null;
let tipoVeioAutomatico = false;
let formaSelecionada = null;
let sugestaoAtual = null;
let debounceTimer = null;

function calcularReaisCentavos() {
  if (rawDigitos.length === 0) return { reais: '0', centavos: '00' };
  if (rawDigitos.length <= 2) return { reais: rawDigitos, centavos: '00' };
  const centavos = rawDigitos.slice(-2);
  const reais = rawDigitos.slice(0, -2) || '0';
  return { reais, centavos };
}

function valorAtualCentavos() {
  const { reais, centavos } = calcularReaisCentavos();
  return parseInt(reais, 10) * 100 + parseInt(centavos, 10);
}

function atualizarDisplayValor() {
  const { reais, centavos } = calcularReaisCentavos();
  const reaisFormatado = reais.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  document.getElementById('valorDisplay').textContent = `${reaisFormatado},${centavos}`;
}

function digitar(n) {
  if (rawDigitos.length >= 7) return;
  rawDigitos += n;
  atualizarDisplayValor();
}

function apagar() {
  rawDigitos = rawDigitos.slice(0, -1);
  atualizarDisplayValor();
}

function setMovimento(tipo) {
  movimento = tipo;
  document.getElementById('btnSaida').classList.toggle('active', tipo === 'saida');
  document.getElementById('btnEntrada').classList.toggle('active', tipo === 'entrada');
  const mostrarCategoria = tipo === 'saida';
  document.getElementById('payRow').style.display = mostrarCategoria ? 'flex' : 'none';
  if (!mostrarCategoria) {
    document.getElementById('tipoRow').style.display = 'none';
    document.getElementById('tipoAutoBadge').style.display = 'none';
    document.getElementById('sugestaoBox').style.display = 'none';
    document.getElementById('parcelasBox').style.display = 'none';
  } else {
    checarDescricao();
  }
}

document.getElementById('descricaoInput').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(checarDescricao, 400);
});

async function checarDescricao() {
  const descricao = document.getElementById('descricaoInput').value.trim();
  document.getElementById('sugestaoBox').style.display = 'none';
  document.getElementById('tipoAutoBadge').style.display = 'none';
  document.getElementById('tipoRow').style.display = 'none';
  tipoSelecionado = null;
  tipoVeioAutomatico = false;

  if (!descricao || movimento !== 'saida') return;

  try {
    const res = await fetch(`${API}/itens/consultar?descricao=${encodeURIComponent(descricao)}`, {
      headers: { 'x-token': token }
    });
    const data = await res.json();

    if (data.status === 'conhecido') {
      tipoSelecionado = data.item.tipo;
      tipoVeioAutomatico = true;
      mostrarTipoAutomatico(data.item.tipo);
    } else if (data.status === 'parecido') {
      sugestaoAtual = data.sugestao;
      document.getElementById('sugestaoTexto').textContent =
        `Você quis dizer "${data.sugestao.nome_item}" (${nomeTipo(data.sugestao.tipo)})?`;
      document.getElementById('sugestaoBox').style.display = 'block';
      document.getElementById('tipoRow').style.display = 'flex';
    } else {
      document.getElementById('tipoRow').style.display = 'flex';
    }
  } catch (e) {
    console.error('Erro ao consultar dicionario:', e);
    document.getElementById('tipoRow').style.display = 'flex';
  }
}

function nomeTipo(tipo) {
  if (tipo === 'fixo') return 'Fixo';
  if (tipo === 'superfluo') return 'Supérfluo';
  return 'Imprevisto';
}

function mostrarTipoAutomatico(tipo) {
  document.getElementById('tipoAutoTexto').textContent = `Categoria: ${nomeTipo(tipo)} (automático)`;
  document.getElementById('tipoAutoBadge').style.display = 'flex';
  document.getElementById('tipoRow').style.display = 'none';
}

function mostrarTiposManual() {
  document.getElementById('tipoAutoBadge').style.display = 'none';
  document.getElementById('tipoRow').style.display = 'flex';
  tipoVeioAutomatico = false;
  atualizarSelecaoTipoVisual();
}

function aceitarSugestao() {
  if (!sugestaoAtual) return;
  document.getElementById('descricaoInput').value = sugestaoAtual.nome_item;
  tipoSelecionado = sugestaoAtual.tipo;
  tipoVeioAutomatico = true;
  document.getElementById('sugestaoBox').style.display = 'none';
  mostrarTipoAutomatico(sugestaoAtual.tipo);
}

function recusarSugestao() {
  document.getElementById('sugestaoBox').style.display = 'none';
  document.getElementById('tipoRow').style.display = 'flex';
}

function selecionarTipo(tipo) {
  tipoSelecionado = tipo;
  tipoVeioAutomatico = false;
  atualizarSelecaoTipoVisual();
}

function atualizarSelecaoTipoVisual() {
  document.querySelectorAll('.tipo-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.classList.contains(tipoSelecionado));
  });
}

function selecionarForma(forma) {
  formaSelecionada = forma;
  document.querySelectorAll('.pay-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.forma === forma);
  });
  document.getElementById('parcelasBox').style.display = forma === 'credito' ? 'flex' : 'none';
}

function mostrarErro(msg) {
  const el = document.getElementById('erroMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function mostrarToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2200);
}

function resetarFormulario() {
  rawDigitos = '';
  document.getElementById('valorDisplay').textContent = '0,00';
  document.getElementById('descricaoInput').value = '';
  tipoSelecionado = null;
  tipoVeioAutomatico = false;
  formaSelecionada = null;
  document.getElementById('tipoRow').style.display = 'none';
  document.getElementById('tipoAutoBadge').style.display = 'none';
  document.getElementById('sugestaoBox').style.display = 'none';
  document.querySelectorAll('.pay-chip').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tipo-btn').forEach(c => c.classList.remove('selected'));
  document.getElementById('parcelasBox').style.display = 'none';
}

async function enviarLancamento() {
  const descricao = document.getElementById('descricaoInput').value.trim();

  if (!descricao) {
    mostrarErro('Digite o que foi lançado.');
    return;
  }
  if (valorAtualCentavos() <= 0) {
    mostrarErro('Digite um valor.');
    return;
  }
  if (movimento === 'saida' && !tipoSelecionado) {
    mostrarErro('Escolha Fixo, Supérfluo ou Imprevisto.');
    return;
  }
  if (movimento === 'saida' && !formaSelecionada) {
    mostrarErro('Escolha a forma de pagamento.');
    return;
  }

  const payload = {
    token,
    descricao,
    valor: (valorAtualCentavos() / 100).toFixed(2),
    tipo_movimento: movimento,
    categoria: movimento === 'saida' ? tipoSelecionado : undefined,
    forma_pagamento: movimento === 'saida' ? formaSelecionada : undefined,
    parcelas: formaSelecionada === 'credito' ? document.getElementById('parcelasSelect').value : 1
  };

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/lancamentos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token': token },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (!res.ok) {
      mostrarErro(data.erro || 'Erro ao salvar. Tente novamente.');
      btn.disabled = false;
      return;
    }

    mostrarToast('Lançado ✓');
    resetarFormulario();
  } catch (e) {
    console.error('Erro ao enviar lancamento:', e);
    mostrarErro('Não conseguimos conectar. Tente de novo.');
  } finally {
    btn.disabled = false;
  }
}

async function carregarSaudacao() {
  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    const data = await res.json();
    if (res.ok) {
      if (data.conta && data.conta.status_assinatura === 'vencido') {
        window.location.href = '/cobranca.html';
        return;
      }
      document.getElementById('greetNome').innerHTML =
        `Oi, ${data.membro.nome.split(' ')[0]}<span>${new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' })}</span>`;
    } else {
      localStorage.removeItem('meubolso_token');
      window.location.href = '/index.html';
    }
  } catch (e) {
    console.error('Erro ao carregar saudacao:', e);
  }
}

carregarSaudacao();
</script>
</body>
</html>
