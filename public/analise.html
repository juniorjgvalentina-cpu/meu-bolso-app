<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.json">
<title>Meu Bolso — Análise</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --ink:#16261F;
  --ink-soft:#3C4B43;
  --paper:#FAF7F0;
  --paper-dim:#F0ECE1;
  --card:#FFFFFF;
  --accent:#E8622C;
  --accent-dark:#C64F1E;
  --line:#E4DFD1;
  --fixo:#2F6FED;
  --superfluo:#E8922C;
  --diaadia:#D9B62C;
  --imprevisto:#D64545;
  --entrada:#2F9E68;
  --erro:#D64545;
  --alerta:#E8922C;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html{ touch-action:manipulation; }
html, body{ height:100%; }
body{
  background:#FFFFFF;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:var(--ink);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom);
  padding-top:env(safe-area-inset-top);
}
.topbar{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:14px 20px 10px;
  max-width:460px; margin:0 auto; width:100%;
  flex-shrink:0;
}
.topbar h1{ font-family:'Sora', sans-serif; font-weight:800; font-size:16px; flex:1; text-align:center; }
.nav-btn{
  width:38px; height:38px; border-radius:11px; background:var(--card);
  border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--ink-soft); flex-shrink:0; transition:transform .1s;
}
.nav-btn:active{ transform:scale(0.9); background:var(--paper-dim); }
.wrap{
  max-width:460px; margin:0 auto; width:100%;
  padding:6px 20px 24px; display:flex; flex-direction:column; gap:16px;
  flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain;
}

.secao{ border:1.5px solid var(--ink); border-radius:16px; padding:16px; }
.secao-titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:12.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px; }

.anéis-row{ display:flex; justify-content:space-around; gap:4px; }
.anel-item{ display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .1s; }
.anel-item:active{ transform:scale(0.94); }
.anel{ width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.anel-buraco{ width:44px; height:44px; border-radius:50%; background:#fff; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:11px; }
.anel-nome{ font-size:9.5px; font-weight:700; color:var(--ink-soft); text-align:center; }
.anel-valor{ font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--ink-soft); }

.comparativo-row{ display:flex; gap:8px; }
.comparativo-card{ flex:1; border:1.5px solid var(--ink); border-radius:12px; padding:12px; text-align:center; }
.comparativo-card .label{ font-size:10px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; }
.comparativo-card .valor{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:17px; margin-top:4px; }
.comparativo-card .barra-fundo{ margin-top:9px; height:7px; }
.diferenca{ text-align:center; margin-top:10px; font-size:12.5px; font-weight:700; }
.diferenca.subiu{ color:var(--erro); }
.diferenca.desceu{ color:var(--entrada); }

.ranking-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.ranking-item:last-child{ border-bottom:none; }
.ranking-item .pos{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12px; color:var(--ink-soft); width:16px; }
.ranking-item .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.ranking-item .nome{ flex:1; font-family:'Sora', sans-serif; font-weight:700; font-size:13px; }
.ranking-item .valor{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px; }

.barra-fundo{ background:var(--paper-dim); border-radius:100px; height:10px; overflow:hidden; border:1px solid var(--line); }
.barra-preenchida{ height:100%; border-radius:100px; transition:width .3s; }

.meta-valores{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:12px; margin-top:8px; color:var(--ink-soft); }
.meta-form{ display:flex; gap:6px; margin-top:10px; }
.meta-form input{ flex:1; border:1.5px solid var(--ink); border-radius:9px; padding:9px 11px; font-size:13px; font-family:'Sora', sans-serif; }
.meta-form button{ background:var(--ink); color:#fff; border:none; border-radius:9px; padding:9px 14px; font-family:'Sora', sans-serif; font-weight:700; font-size:12.5px; }

.orcamento-item{ margin-bottom:14px; }
.orcamento-item:last-child{ margin-bottom:0; }
.orcamento-topo{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.orcamento-nome{ display:flex; align-items:center; gap:6px; font-family:'Sora', sans-serif; font-weight:700; font-size:12.5px; }
.orcamento-nome .dot{ width:9px; height:9px; border-radius:50%; }
.orcamento-valores{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ink-soft); }
.orcamento-alerta{ font-size:10.5px; font-weight:700; margin-top:4px; }
.orcamento-alerta.amarelo{ color:var(--alerta); }
.orcamento-alerta.vermelho{ color:var(--erro); }
.definir-teto{ display:flex; gap:6px; margin-top:6px; }
.definir-teto input{ flex:1; border:1.5px solid var(--ink); border-radius:8px; padding:7px 10px; font-size:12px; font-family:'Sora', sans-serif; }
.definir-teto button{ background:var(--card); border:1.5px solid var(--ink); border-radius:8px; padding:7px 12px; font-family:'Sora', sans-serif; font-weight:700; font-size:11.5px; }

.vazio{ text-align:center; color:var(--ink-soft); font-size:12.5px; padding:10px; }

.erro-msg{
  background:#FBEAEA; color:var(--erro); font-size:12.5px; font-weight:600;
  padding:10px 14px; border-radius:10px; display:none;
}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:100px;
  font-family:'Sora', sans-serif; font-size:13px; font-weight:600; display:none; white-space:nowrap; z-index:10;
}

.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(22,38,31,.55);
  align-items:center; justify-content:center; z-index:50; padding:24px;
}
.modal-overlay.visivel{ display:flex; }
.modal-card{
  background:var(--card); border:1.5px solid var(--ink); border-radius:18px; padding:22px 20px;
  max-width:340px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.modal-titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:15.5px; margin-bottom:8px; }
.modal-mensagem{ font-size:13px; line-height:1.5; color:var(--ink-soft); margin-bottom:18px; }
.modal-botoes{ display:flex; gap:8px; }
.modal-botoes button{
  flex:1; padding:11px; border-radius:11px; font-family:'Sora', sans-serif; font-weight:700; font-size:13px; border:1.5px solid var(--ink);
}
.modal-cancelar{ background:var(--card); color:var(--ink-soft); }
.modal-confirmar{ background:var(--erro); color:#fff; border-color:var(--erro); }

.link-acao{ font-size:11px; font-weight:700; color:var(--ink-soft); text-decoration:underline; }
.link-acao.excluir{ color:var(--erro); }
.acoes-meta-orcamento{ display:flex; gap:14px; margin-top:6px; justify-content:flex-end; }

.detalhe-overlay{
  display:none; position:fixed; inset:0; background:rgba(22,38,31,.55);
  align-items:flex-end; justify-content:center; z-index:60;
}
.detalhe-overlay.visivel{ display:flex; }
.detalhe-card{
  background:var(--card); border:1.5px solid var(--ink); border-radius:20px 20px 0 0;
  padding:18px 18px 24px; max-width:460px; width:100%; max-height:75vh; display:flex; flex-direction:column;
}
.detalhe-topo{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-shrink:0; }
.detalhe-titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:15px; }
.detalhe-fechar{ width:32px; height:32px; border-radius:9px; border:1.5px solid var(--ink); background:var(--card); font-size:14px; }
.detalhe-lista{ overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
.detalhe-item{ display:flex; align-items:center; gap:10px; border:1.5px solid var(--ink); border-radius:12px; padding:10px 12px; }
.detalhe-item .info{ flex:1; min-width:0; }
.detalhe-item .desc{ font-family:'Sora', sans-serif; font-weight:700; font-size:13px; }
.detalhe-item .data{ font-size:10.5px; color:var(--ink-soft); margin-top:1px; }
.detalhe-item .valor{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px; flex-shrink:0; }
.detalhe-total{ text-align:center; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px; margin-top:12px; flex-shrink:0; color:var(--ink-soft); }
</style>
</head>
<body>

<div class="topbar">
  <div class="nav-btn" onclick="window.location.href='/planilha.html'">←</div>
  <h1>Análise</h1>
  <div class="nav-btn" onclick="location.reload()">🔄</div>
</div>

<div class="wrap">

  <div class="erro-msg" id="erroMsg"></div>

  <div class="secao">
    <div class="secao-titulo">Por categoria (este mês)</div>
    <div class="anéis-row" id="aneisRow"></div>
  </div>

  <div class="secao">
    <div class="secao-titulo">Comparativo com o mês passado</div>
    <div class="comparativo-row">
      <div class="comparativo-card">
        <div class="label">Mês passado</div>
        <div class="valor" id="valorMesAnterior">R$ 0,00</div>
        <div class="barra-fundo"><div class="barra-preenchida" id="barraMesAnterior" style="width:0%; background:var(--ink-soft);"></div></div>
      </div>
      <div class="comparativo-card">
        <div class="label">Este mês</div>
        <div class="valor" id="valorMesAtual">R$ 0,00</div>
        <div class="barra-fundo"><div class="barra-preenchida" id="barraMesAtual" style="width:0%; background:var(--accent);"></div></div>
      </div>
    </div>
    <div class="diferenca" id="diferencaTexto"></div>
  </div>

  <div class="secao">
    <div class="secao-titulo">O que mais pesou</div>
    <div id="rankingLista"></div>
  </div>

  <div class="secao">
    <div class="secao-titulo">Meta de economia</div>
    <div class="barra-fundo"><div class="barra-preenchida" id="metaBarra" style="width:0%; background:var(--entrada);"></div></div>
    <div class="meta-valores">
      <span id="metaAtual">Economizado: R$ 0,00</span>
      <span id="metaAlvo">Meta: —</span>
    </div>
    <div class="meta-form">
      <input type="text" id="metaInput" placeholder="Nova meta (ex: 300)" inputmode="decimal">
      <button onclick="salvarMeta()">Salvar</button>
    </div>
    <div class="acoes-meta-orcamento" id="acoesMeta" style="display:none;">
      <span class="link-acao excluir" onclick="solicitarCancelarMeta()">Cancelar meta</span>
    </div>
  </div>

  <div class="secao">
    <div class="secao-titulo">Orçamento por categoria</div>
    <div id="orcamentosLista"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-titulo" id="modalTitulo"></div>
    <div class="modal-mensagem" id="modalMensagem"></div>
    <div class="modal-botoes">
      <button class="modal-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="modal-confirmar" id="modalBtnConfirmar">Confirmar</button>
    </div>
  </div>
</div>

<div class="detalhe-overlay" id="detalheOverlay">
  <div class="detalhe-card">
    <div class="detalhe-topo">
      <div class="detalhe-titulo" id="detalheTitulo"></div>
      <button class="detalhe-fechar" onclick="fecharDetalhes()">✕</button>
    </div>
    <div class="detalhe-lista" id="detalheLista"></div>
    <div class="detalhe-total" id="detalheTotal"></div>
  </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('meubolso_token');

if (!token) {
  window.location.href = '/index.html';
}

const CORES = { fixo: 'var(--fixo)', superfluo: 'var(--superfluo)', diaadia: 'var(--diaadia)', imprevisto: 'var(--imprevisto)' };
const NOMES_CATEGORIA = { fixo: 'Fixo', superfluo: 'Supérfluo', diaadia: 'Dia a dia', imprevisto: 'Imprevisto' };

function formatarMoeda(valor) {
  const n = Number(valor || 0);
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function paraNumero(str) {
  if (str === undefined || str === null || str === '') return NaN;
  let s = String(str).trim();
  if (s.includes(',')) {
    s = s.replace(/\./g, '').replace(',', '.');
  }
  return Number(s);
}

function mostrarErro(msg) {
  const el = document.getElementById('erroMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function mostrarToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2200);
}

let acaoConfirmada = null;

function abrirModal(titulo, mensagem, textoBotao, callback) {
  document.getElementById('modalTitulo').textContent = titulo;
  document.getElementById('modalMensagem').textContent = mensagem;
  document.getElementById('modalBtnConfirmar').textContent = textoBotao;
  acaoConfirmada = callback;
  document.getElementById('modalOverlay').classList.add('visivel');
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('visivel');
  acaoConfirmada = null;
}

document.getElementById('modalBtnConfirmar').addEventListener('click', () => {
  const acao = acaoConfirmada;
  fecharModal();
  if (acao) acao();
});

let lancamentosCache = [];

async function carregarAnalise() {
  try {
    const [resAnalise, resLancamentos] = await Promise.all([
      fetch(`${API}/analise`, { headers: { 'x-token': token } }),
      fetch(`${API}/lancamentos`, { headers: { 'x-token': token } })
    ]);
    const data = await resAnalise.json();
    const dadosLancamentos = await resLancamentos.json();
    if (!resAnalise.ok) throw new Error(data.erro || 'Erro ao carregar análise.');

    lancamentosCache = dadosLancamentos.lancamentos || [];

    renderizarAneis(data.mesAtual);
    renderizarComparativo(data.mesAtual, data.mesAnterior);
    renderizarRanking(data.ranking);
    renderizarMeta(data.mesAtual, data.meta);
    renderizarOrcamentos(data.orcamentos);
  } catch (e) {
    console.error(e);
    mostrarErro('Não foi possível carregar a análise.');
  }
}

function formatarDataHora(dataStr) {
  const d = new Date(dataStr);
  const dataFmt = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const horaFmt = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return `${dataFmt} · ${horaFmt}`;
}

function mostrarDetalhesCategoria(categoria) {
  const itens = lancamentosCache.filter(l => l.tipo_movimento === 'saida' && l.categoria === categoria);
  const total = itens.reduce((soma, l) => soma + Number(l.valor), 0);

  document.getElementById('detalheTitulo').textContent = `${NOMES_CATEGORIA[categoria]} — este mês`;

  const lista = document.getElementById('detalheLista');
  lista.innerHTML = itens.length
    ? itens.map(l => {
        const parcelaInfo = l.total_parcelas ? ` (${l.parcela_atual}/${l.total_parcelas})` : '';
        return `
          <div class="detalhe-item">
            <div class="info">
              <div class="desc">${escapeHtml(l.descricao)}${parcelaInfo}</div>
              <div class="data">${formatarDataHora(l.data_lancamento)}</div>
            </div>
            <div class="valor">${formatarMoeda(l.valor)}</div>
          </div>
        `;
      }).join('')
    : '<div class="vazio">Nada nessa categoria ainda.</div>';

  document.getElementById('detalheTotal').textContent = `Total: ${formatarMoeda(total)}`;
  document.getElementById('detalheOverlay').classList.add('visivel');
}

function fecharDetalhes() {
  document.getElementById('detalheOverlay').classList.remove('visivel');
}

function renderizarAneis(mesAtual) {
  const total = mesAtual.totalGasto || 0;
  const categorias = ['fixo', 'superfluo', 'diaadia', 'imprevisto'];

  document.getElementById('aneisRow').innerHTML = categorias.map(cat => {
    const valor = mesAtual[cat] || 0;
    const pct = total > 0 ? Math.round((valor / total) * 100) : 0;
    return `
      <div class="anel-item" onclick="mostrarDetalhesCategoria('${cat}')">
        <div class="anel" style="background:conic-gradient(${CORES[cat]} ${pct}%, var(--paper-dim) 0);">
          <div class="anel-buraco">${pct}%</div>
        </div>
        <div class="anel-nome">${NOMES_CATEGORIA[cat]}</div>
        <div class="anel-valor">${formatarMoeda(valor)}</div>
      </div>
    `;
  }).join('');
}

function renderizarComparativo(mesAtual, mesAnterior) {
  document.getElementById('valorMesAnterior').textContent = formatarMoeda(mesAnterior.totalGasto);
  document.getElementById('valorMesAtual').textContent = formatarMoeda(mesAtual.totalGasto);

  const maiorValor = Math.max(mesAtual.totalGasto, mesAnterior.totalGasto, 1);
  document.getElementById('barraMesAnterior').style.width = ((mesAnterior.totalGasto / maiorValor) * 100) + '%';
  document.getElementById('barraMesAtual').style.width = ((mesAtual.totalGasto / maiorValor) * 100) + '%';

  const diferencaEl = document.getElementById('diferencaTexto');
  if (mesAnterior.totalGasto > 0) {
    const diffPct = ((mesAtual.totalGasto - mesAnterior.totalGasto) / mesAnterior.totalGasto) * 100;
    const subiu = diffPct > 0;
    diferencaEl.className = 'diferenca ' + (subiu ? 'subiu' : 'desceu');
    diferencaEl.textContent = `${subiu ? '↑' : '↓'} ${Math.abs(diffPct).toFixed(0)}% ${subiu ? 'a mais' : 'a menos'} que o mês passado`;
  } else if (mesAtual.totalGasto > 0) {
    diferencaEl.className = 'diferenca subiu';
    diferencaEl.textContent = 'Sem gastos registrados no mês passado pra comparar';
  } else {
    diferencaEl.className = 'diferenca';
    diferencaEl.textContent = 'Ainda sem dados suficientes pra comparar';
  }
}

function renderizarRanking(ranking) {
  const lista = document.getElementById('rankingLista');
  if (!ranking.length) {
    lista.innerHTML = '<div class="vazio">Nenhum gasto neste mês ainda.</div>';
    return;
  }
  lista.innerHTML = ranking.map((item, i) => `
    <div class="ranking-item">
      <span class="pos">${i + 1}º</span>
      <span class="dot" style="background:${CORES[item.categoria] || 'var(--imprevisto)'}"></span>
      <span class="nome">${escapeHtml(item.descricao)}</span>
      <span class="valor">${formatarMoeda(item.total)}</span>
    </div>
  `).join('');
}

function renderizarMeta(mesAtual, meta) {
  const economia = mesAtual.saldo;
  document.getElementById('metaAtual').textContent = `Economizado: ${formatarMoeda(economia)}`;

  const barra = document.getElementById('metaBarra');
  const acoesMeta = document.getElementById('acoesMeta');
  if (meta) {
    document.getElementById('metaAlvo').textContent = `Meta: ${formatarMoeda(meta)}`;
    document.getElementById('metaInput').placeholder = `Editar meta (atual: ${formatarMoeda(meta)})`;
    const pct = Math.max(0, Math.min(100, (economia / meta) * 100));
    barra.style.width = pct + '%';
    barra.style.background = economia < 0 ? 'var(--erro)' : 'var(--entrada)';
    acoesMeta.style.display = 'flex';
  } else {
    document.getElementById('metaAlvo').textContent = 'Meta: não definida';
    document.getElementById('metaInput').placeholder = 'Nova meta (ex: 300)';
    barra.style.width = '0%';
    acoesMeta.style.display = 'none';
  }
}

function solicitarCancelarMeta() {
  abrirModal(
    'Cancelar meta',
    'Tem certeza que quer cancelar a meta de economia? Você pode definir uma nova quando quiser.',
    'Cancelar meta',
    cancelarMeta
  );
}

async function cancelarMeta() {
  try {
    const res = await fetch(`${API}/analise/meta`, { method: 'DELETE', headers: { 'x-token': token } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao cancelar meta.');
    mostrarToast('Meta cancelada.');
    await carregarAnalise();
  } catch (e) {
    mostrarErro(e.message);
  }
}

function renderizarOrcamentos(orcamentos) {
  document.getElementById('orcamentosLista').innerHTML = orcamentos.map(o => {
    const cor = CORES[o.categoria];

    if (!o.valor_teto) {
      return `
        <div class="orcamento-item">
          <div class="orcamento-nome"><span class="dot" style="background:${cor}"></span>${NOMES_CATEGORIA[o.categoria]}</div>
          <div class="orcamento-valores">Gasto até agora: ${formatarMoeda(o.gasto_atual)} · sem teto definido</div>
          <div class="definir-teto">
            <input type="text" id="teto-${o.categoria}" placeholder="Definir teto (ex: 400)" inputmode="decimal">
            <button onclick="salvarOrcamento('${o.categoria}')">Definir</button>
          </div>
        </div>
      `;
    }

    const pct = Math.min(100, (o.gasto_atual / o.valor_teto) * 100);
    let corBarra = 'var(--entrada)';
    let alerta = '';
    if (pct >= 100) {
      corBarra = 'var(--erro)';
      alerta = '<div class="orcamento-alerta vermelho">Orçamento estourado</div>';
    } else if (pct >= 80) {
      corBarra = 'var(--alerta)';
      alerta = '<div class="orcamento-alerta amarelo">Perto do limite</div>';
    }

    return `
      <div class="orcamento-item">
        <div class="orcamento-topo">
          <div class="orcamento-nome"><span class="dot" style="background:${cor}"></span>${NOMES_CATEGORIA[o.categoria]}</div>
          <div class="orcamento-valores">${formatarMoeda(o.gasto_atual)} / ${formatarMoeda(o.valor_teto)}</div>
        </div>
        <div class="barra-fundo"><div class="barra-preenchida" style="width:${pct}%; background:${corBarra};"></div></div>
        ${alerta}
        <div class="definir-teto">
          <input type="text" id="teto-${o.categoria}" placeholder="Novo teto" inputmode="decimal">
          <button onclick="salvarOrcamento('${o.categoria}')">Atualizar</button>
        </div>
        <div class="acoes-meta-orcamento">
          <span class="link-acao excluir" onclick="solicitarCancelarOrcamento('${o.categoria}')">Cancelar orçamento</span>
        </div>
      </div>
    `;
  }).join('');
}

function solicitarCancelarOrcamento(categoria) {
  abrirModal(
    'Cancelar orçamento',
    `Tem certeza que quer cancelar o orçamento de ${NOMES_CATEGORIA[categoria]}? Você pode definir um novo teto quando quiser.`,
    'Cancelar orçamento',
    () => cancelarOrcamento(categoria)
  );
}

async function cancelarOrcamento(categoria) {
  try {
    const res = await fetch(`${API}/analise/orcamento/${categoria}`, { method: 'DELETE', headers: { 'x-token': token } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao cancelar orçamento.');
    mostrarToast('Orçamento cancelado.');
    await carregarAnalise();
  } catch (e) {
    mostrarErro(e.message);
  }
}

async function salvarMeta() {
  const valorInput = document.getElementById('metaInput').value.trim();
  const valorNum = paraNumero(valorInput);
  if (!valorInput || isNaN(valorNum) || valorNum <= 0) {
    mostrarErro('Digite um valor de meta válido.');
    return;
  }

  try {
    const res = await fetch(`${API}/analise/meta`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token': token },
      body: JSON.stringify({ valor_meta_economia: valorNum })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao salvar meta.');
    document.getElementById('metaInput').value = '';
    mostrarToast('Meta salva ✓');
    await carregarAnalise();
  } catch (e) {
    mostrarErro(e.message);
  }
}

async function salvarOrcamento(categoria) {
  const input = document.getElementById(`teto-${categoria}`);
  const valorNum = paraNumero(input.value.trim());
  if (!input.value.trim() || isNaN(valorNum) || valorNum <= 0) {
    mostrarErro('Digite um valor de orçamento válido.');
    return;
  }

  try {
    const res = await fetch(`${API}/analise/orcamento`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-token': token },
      body: JSON.stringify({ categoria, valor_teto: valorNum })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao salvar orçamento.');
    mostrarToast('Orçamento definido ✓');
    await carregarAnalise();
  } catch (e) {
    mostrarErro(e.message);
  }
}

function escapeHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

carregarAnalise();
</script>
</body>
</html>
