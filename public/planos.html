<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.json">
<title>Meu Bolso — Planos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --ink:#16261F;
  --ink-soft:#3C4B43;
  --paper:#FAF7F0;
  --paper-dim:#F0ECE1;
  --card:#FFFFFF;
  --accent:#E8622C;
  --accent-dark:#C64F1E;
  --line:#E4DFD1;
  --entrada:#2F9E68;
  --erro:#D64545;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html{ touch-action:manipulation; }
html, body{ height:100%; }
body{
  background:#FFFFFF;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:var(--ink);
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  overscroll-behavior:none;
  padding-bottom:env(safe-area-inset-bottom);
  padding-top:env(safe-area-inset-top);
}
.topbar{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:14px 20px 10px;
  max-width:460px; margin:0 auto; width:100%;
  flex-shrink:0;
}
.topbar h1{ font-family:'Sora', sans-serif; font-weight:800; font-size:16px; flex:1; text-align:center; }
.nav-btn{
  width:38px; height:38px; border-radius:11px; background:var(--card);
  border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--ink-soft); flex-shrink:0; transition:transform .1s;
}
.nav-btn:active{ transform:scale(0.9); background:var(--paper-dim); }
.wrap{
  max-width:460px; margin:0 auto; width:100%;
  padding:6px 20px 24px; display:flex; flex-direction:column; gap:12px;
  flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain;
}

.info-atual{
  border:1.5px solid var(--ink); border-radius:16px; padding:16px; text-align:center;
}
.info-atual .label{ font-size:11.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.info-atual .valor{ font-family:'Sora', sans-serif; font-weight:800; font-size:20px; margin-top:4px; }
.info-atual .sub{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

.plano-card{
  border:1.5px solid var(--ink); border-radius:16px; padding:16px; position:relative;
}
.plano-card.atual{ background:var(--paper-dim); }
.plano-topo{ display:flex; justify-content:space-between; align-items:center; }
.plano-nome{ font-family:'Sora', sans-serif; font-weight:800; font-size:15px; }
.badge-atual{
  font-size:9.5px; font-weight:800; background:var(--ink); color:#fff; padding:3px 8px; border-radius:100px; text-transform:uppercase;
}
.plano-preco{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:22px; margin-top:6px; }
.plano-preco span{ font-size:12px; font-weight:600; color:var(--ink-soft); }
.plano-limite{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
.plano-economia{ font-size:11px; color:var(--entrada); font-weight:700; margin-top:4px; }
.plano-indisponivel{ font-size:12px; color:var(--ink-soft); margin-top:10px; padding:10px; background:var(--paper-dim); border-radius:10px; text-align:center; }
.plano-btn{
  margin-top:12px; width:100%; padding:11px; border-radius:11px; border:1.5px solid var(--ink);
  font-family:'Sora', sans-serif; font-weight:700; font-size:13px; background:var(--card); color:var(--ink);
}
.plano-btn.destaque{ background:var(--ink); color:#fff; }
.plano-btn:disabled{ opacity:.5; }

.erro-msg{
  background:#FBEAEA; color:var(--erro); font-size:12.5px; font-weight:600;
  padding:10px 14px; border-radius:10px; display:none;
}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:100px;
  font-family:'Sora', sans-serif; font-size:13px; font-weight:600; display:none; white-space:nowrap; z-index:10;
}

.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(22,38,31,.55);
  align-items:center; justify-content:center; z-index:50; padding:24px;
}
.modal-overlay.visivel{ display:flex; }
.modal-card{
  background:var(--card); border:1.5px solid var(--ink); border-radius:18px; padding:22px 20px;
  max-width:340px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.modal-titulo{ font-family:'Sora', sans-serif; font-weight:800; font-size:15.5px; margin-bottom:8px; }
.modal-mensagem{ font-size:13px; line-height:1.5; color:var(--ink-soft); margin-bottom:18px; }
.modal-botoes{ display:flex; gap:8px; }
.modal-botoes button{
  flex:1; padding:11px; border-radius:11px; font-family:'Sora', sans-serif; font-weight:700; font-size:13px; border:1.5px solid var(--ink);
}
.modal-cancelar{ background:var(--card); color:var(--ink-soft); }
.modal-confirmar{ background:var(--entrada); color:#fff; border-color:var(--entrada); }
</style>
</head>
<body>

<div class="topbar">
  <div class="nav-btn" onclick="window.location.href='/configuracoes.html'">←</div>
  <h1>Trocar de Plano</h1>
  <div class="nav-btn" onclick="location.reload()">🔄</div>
</div>

<div class="wrap">

  <div class="erro-msg" id="erroMsg"></div>

  <div class="info-atual">
    <div class="label">Sua conta hoje</div>
    <div class="valor" id="infoPlanoAtual">—</div>
    <div class="sub" id="infoMembros">—</div>
  </div>

  <div id="listaPlanos"></div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-titulo" id="modalTitulo"></div>
    <div class="modal-mensagem" id="modalMensagem"></div>
    <div class="modal-botoes">
      <button class="modal-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="modal-confirmar" id="modalBtnConfirmar">Confirmar</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('meubolso_token');

if (!token) {
  window.location.href = '/index.html';
}

const NOMES_PLANO = { individual: 'Individual', casal: 'Casal', familia: 'Família' };
const ORDEM_PLANOS = ['individual', 'casal', 'familia'];

let dadosAtuais = null;
let periodoSelecionado = 'mensal';

function mostrarErro(msg) {
  const el = document.getElementById('erroMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function mostrarToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2200);
}

let acaoConfirmada = null;

function abrirModal(titulo, mensagem, textoBotao, callback) {
  document.getElementById('modalTitulo').textContent = titulo;
  document.getElementById('modalMensagem').textContent = mensagem;
  document.getElementById('modalBtnConfirmar').textContent = textoBotao;
  acaoConfirmada = callback;
  document.getElementById('modalOverlay').classList.add('visivel');
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('visivel');
  acaoConfirmada = null;
}

document.getElementById('modalBtnConfirmar').addEventListener('click', () => {
  const acao = acaoConfirmada;
  fecharModal();
  if (acao) acao();
});

function formatarMoeda(valor) {
  return 'R$ ' + Number(valor).toFixed(2).replace('.', ',');
}

async function carregarPlanos() {
  try {
    const res = await fetch(`${API}/planos`, { headers: { 'x-token': token } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao buscar planos.');

    dadosAtuais = data;
    periodoSelecionado = 'mensal';

    const planoAtualInfo = data.planos[data.plano_atual];
    const valorAtual = planoAtualInfo[data.periodicidade_atual] || planoAtualInfo.mensal;
    document.getElementById('infoPlanoAtual').textContent = `Plano ${NOMES_PLANO[data.plano_atual]} — ${formatarMoeda(valorAtual)}/${data.periodicidade_atual === 'anual' ? 'ano' : 'mês'}`;
    document.getElementById('infoMembros').textContent = `${data.total_membros} de ${planoAtualInfo.limite_membros} pessoa(s) na conta`;

    renderizarPlanos();
  } catch (e) {
    console.error(e);
    if (e.message && e.message.includes('Só o dono')) {
      mostrarErro('Só o dono da conta pode trocar de plano.');
    } else {
      mostrarErro('Não foi possível carregar os planos.');
    }
  }
}

function renderizarPlanos() {
  const lista = document.getElementById('listaPlanos');

  lista.innerHTML = ORDEM_PLANOS.map(chave => {
    const p = dadosAtuais.planos[chave];
    const valor = p[periodoSelecionado];
    const semOpcao = valor === null || valor === undefined;

    const ehAtual = chave === dadosAtuais.plano_atual && periodoSelecionado === dadosAtuais.periodicidade_atual;
    const bloqueado = dadosAtuais.total_membros > p.limite_membros;

    let economiaHtml = '';
    if (periodoSelecionado === 'anual' && !semOpcao) {
      const custoMensalNoAno = p.mensal * 12;
      const economia = custoMensalNoAno - valor;
      if (economia > 0) {
        economiaHtml = `<div class="plano-economia">Economiza ${formatarMoeda(economia)} por ano</div>`;
      }
    }

    let corpo;
    if (semOpcao) {
      corpo = `<div class="plano-indisponivel">Esse plano ainda não tem opção anual. Use o mensal (${formatarMoeda(p.mensal)}/mês).</div>`;
    } else {
      let botao;
      if (ehAtual) {
        botao = `<button class="plano-btn" disabled>Plano atual</button>`;
      } else if (bloqueado) {
        botao = `<button class="plano-btn" onclick="window.location.href='/membros.html'">Remover membros pra liberar</button>`;
      } else {
        botao = `<button class="plano-btn destaque" onclick="solicitarTroca('${chave}')">Escolher ${p.nome}</button>`;
      }
      corpo = `
        <div class="plano-preco">${formatarMoeda(valor)}<span>/${periodoSelecionado === 'anual' ? 'ano' : 'mês'}</span></div>
        ${economiaHtml}
        <div class="plano-limite">Até ${p.limite_membros} pessoa${p.limite_membros > 1 ? 's' : ''} na conta</div>
        ${botao}
      `;
    }

    return `
      <div class="plano-card ${ehAtual ? 'atual' : ''}">
        <div class="plano-topo">
          <div class="plano-nome">${p.nome}</div>
          ${ehAtual ? '<span class="badge-atual">Atual</span>' : ''}
        </div>
        ${corpo}
      </div>
    `;
  }).join('');
}

function solicitarTroca(planoNovo) {
  const p = dadosAtuais.planos[planoNovo];
  const valorNovo = p[periodoSelecionado];
  const atual = dadosAtuais.planos[dadosAtuais.plano_atual];
  const valorAtual = atual[dadosAtuais.periodicidade_atual] || atual.mensal;
  const subindo = valorNovo > valorAtual;
  const rotuloPeriodo = periodoSelecionado === 'anual' ? 'ano' : 'mês';

  const mensagem = subindo
    ? `Você vai mudar pro plano ${p.nome} (${formatarMoeda(valorNovo)}/${rotuloPeriodo}). A troca é imediata e já libera espaço pra mais gente na conta. Deseja continuar?`
    : `Você vai mudar pro plano ${p.nome} (${formatarMoeda(valorNovo)}/${rotuloPeriodo}). A troca é imediata. Deseja continuar?`;

  abrirModal(`Trocar pro plano ${p.nome}`, mensagem, 'Trocar plano', () => trocarPlano(planoNovo));
}

async function trocarPlano(planoNovo) {
  try {
    const res = await fetch(`${API}/planos`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-token': token },
      body: JSON.stringify({ plano: planoNovo, periodicidade: periodoSelecionado })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || 'Erro ao trocar plano.');

    mostrarToast('Plano atualizado ✓');
    await carregarPlanos();
  } catch (e) {
    mostrarErro(e.message);
  }
}

carregarPlanos();
</script>
</body>
</html>
